#
# Drop-in for a remote worker instance on this host, serving the spark tags
# only, so it never claims the central host's vm/vm-run jobs. Install as
# ~/.config/systemd/user/windmill-worker@0000.service.d/override.conf.
[Service]
Environment=WORKER_GROUP=spark
Environment=WORKER_TAGS=spark,spark-run
