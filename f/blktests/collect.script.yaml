summary: 'Collect a group''s results from the share'
description: |-
  Read one group's per-test TSV results back from the `blktests` share, under
  `$WORKERS_DIR/shared/blktests/<vm>/<kver>/results/`. One test number can
  yield several rows (one per device dir and set_conditions variant); every
  row is reported, failures first, each with its `reason` and runtime.

  Returns `{group, status, crashed, timed_out, started_realtime_ms,
  ended_realtime_ms, rows, stats}`, `stats` being the pass/fail/notrun counts.
  The run's outcome from `f/blktests/wait` gates the verdict, and zero rows is
  `notrun`, never a pass. Read-only; the host never contacts the guest.
lock: '!inline f/blktests/collect.script.lock'
kind: script
schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  order:
    - vm_name
    - group
    - kernel_version
    - unit_ok
    - crashed
    - timed_out
    - started_realtime_ms
    - ended_realtime_ms
  properties:
    crashed:
      type: boolean
      description: |-
        Whether `f/blktests/wait` saw the guest go down (the host
        `qemu-system@<vm>.service` not alive); forces a `failed` verdict.
      default: false
      title: Crashed
    ended_realtime_ms:
      type: integer
      description: |-
        Wall-clock end of the group's run from `f/blktests/wait`, milliseconds
        since the epoch; null when unknown. Passed through for
        `f/monitoring/annotate`, never a verdict input.
      default: null
      title: Ended Realtime Ms
    group:
      type: string
      description: |-
        blktests group name whose `results/*/<group>` rows to read.
    kernel_version:
      type: string
      description: |-
        The guest's kernel release (`uname -r`, from `discover`); selects
        which `<kver>` subtree of the share's results to read.
      title: Kernel Version
    started_realtime_ms:
      type: integer
      description: |-
        Wall-clock start of the group's run from `f/blktests/wait`,
        milliseconds since the epoch; null when unknown. Passed through for
        `f/monitoring/annotate`, never a verdict input.
      default: null
      title: Started Realtime Ms
    timed_out:
      type: boolean
      description: |-
        Whether `f/blktests/wait` gave up on the group and stopped its unit;
        forces a `failed` verdict.
      default: false
      title: Timed Out
    unit_ok:
      type: boolean
      description: |-
        Whether `blktests@<group>.service` finished cleanly (`Result` is
        `success` from `f/blktests/wait`); false forces a `failed` verdict
        even when plausible rows exist.
      default: false
      title: Unit OK
    vm_name:
      type: object
      description: |-
        VM whose `blktests` share
        (`$WORKERS_DIR/shared/blktests/<vm>/<kver>/results`) to read.
      format: dynselect-list_vms
      title: VM Name
  required:
    - vm_name
    - group
    - kernel_version
tag: vm
