summary: Start a group on a guest
description: |-
  Clear the group's previous results from the share, then start
  `blktests@<group>.service` on the guest over vsock-SSH with `--no-block`,
  so the call returns while `./check` runs. `f/blktests/wait` polls for the
  outcome.

  Returns `{vm, group, unit, active_state}`; `active_state` is informational,
  never a verdict.
lock: '!inline f/blktests/start.script.lock'
kind: script
schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  order:
    - vm_name
    - group
    - kernel_version
  properties:
    group:
      type: string
      description: |-
        blktests group name to start as `blktests@<group>.service`.
    kernel_version:
      type: string
      description: |-
        The guest's kernel release (`uname -r`, from `discover`); selects
        which `<kver>` subtree's stale result subtrees to remove before the
        start.
      default: ''
      title: Kernel Version
    vm_name:
      type: object
      description: Booted VM to start the blktests group on, over vsock-SSH.
      format: dynselect-list_vms
      title: VM Name
  required:
    - vm_name
    - group
tag: vm
