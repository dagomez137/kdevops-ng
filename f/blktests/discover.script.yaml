summary: 'Discover a guest''s readiness over SSH'
description: |-
  Reach a booted guest over vsock-SSH and report whether it is ready to run
  blktests, and on what. Enumerates the NVMe data disks, the installed test
  groups and the kernel release, and writes the group names to the per-VM
  picker cache on the share (`groups.json`) that the run form's Groups
  dropdown reads.

  Returns `{vm, host, booted, blktests_ready, devices, groups,
  kernel_version}`. Fails fast when the guest is not blktests-ready, or
  exposes no groups at all. Read-only on the guest; the only host write is
  the picker cache.
lock: '!inline f/blktests/discover.script.lock'
kind: script
schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  order:
    - vm_name
  properties:
    vm_name:
      type: object
      description: Booted VM to probe over vsock-SSH for blktests readiness.
      format: dynselect-list_vms
      title: VM Name
  required:
    - vm_name
tag: vm
