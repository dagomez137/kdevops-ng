summary: Aggregate group results into a verdict
description: |-
  Fold the list of `f/blktests/collect` results (one per group) into one
  rollup, with a `status` of `failed` if any group failed, crashed, timed out,
  or was `notrun`, else `passed`. Returns a Windmill `render_all` of three
  native tables (no markdown): run info (testsuite, kernel, guest), one row
  per group (pass/fail/notrun counts, crash/timeout flags, status), and one
  row per (devdir, test) across all groups (status, reason, runtime; failures
  first). When `vm_name` is given it also writes the structured rollup to
  `$WORKERS_DIR/shared/blktests/<vm>/<kver>/report.json`. The host never
  contacts the guest.
lock: '!inline f/blktests/report.script.lock'
kind: script
schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  order:
    - per_group
    - vm_name
  properties:
    per_group:
      type: array
      description: |-
        The `f/blktests/collect` result objects, one per group, to aggregate.
      default: []
      items:
        type: object
      title: Per Group
    vm_name:
      type: string
      description: |-
        Optional: when set, also write the rollup to
        `$WORKERS_DIR/shared/blktests/<vm>/<kver>/report.json`.
      default: ''
      title: VM Name
  required:
    - per_group
