summary: Aggregate group results into a verdict
description: |-
  Fold the per-group `f/blktests/collect` results into one rollup, `passed`
  only when every group passed. Returns a Windmill `render_all` of three
  native tables: run info, one row per group, and one row per (devdir, test)
  across all groups, failures first. With a `vm_name` it also writes the
  rollup to `<share>/<kver>/report.json`. The host never contacts the guest.
lock: '!inline f/blktests/report.script.lock'
kind: script
schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  order:
    - per_group
    - vm_name
  properties:
    per_group:
      type: array
      description: |-
        The `f/blktests/collect` result objects, one per group, to aggregate.
      default: []
      items:
        type: object
      title: Per Group
    vm_name:
      type: string
      description: |-
        Optional: when set, also write the rollup to
        `$WORKERS_DIR/shared/blktests/<vm>/<kver>/report.json`.
      default: ''
      title: VM Name
  required:
    - per_group
