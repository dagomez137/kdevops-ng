summary: Stop a group on a guest
description: |-
  Stop the run's `blktests@<group>.service` units on the guest over vsock-SSH,
  and any lingering per-test `blktests-*.scope`. Wired as `check.flow`'s
  `failure_module`, so cancelling a run from the Windmill UI tears the guest
  side down instead of leaving `./check` burning CPU.

  Returns `{vm_name, stopped, skipped_no_transport}`. Idempotent; a guest
  unreachable from the worker is logged and skipped, never raised.
lock: '!inline f/blktests/stop.script.lock'
kind: script
schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  order:
    - vm_name
    - groups
  properties:
    groups:
      type: object
      description: |-
        blktests group names whose `blktests@<group>.service` to stop. Empty =
        no-op.
      default: []
      format: dynmultiselect-list_groups
      title: Groups
    vm_name:
      type: object
      description: Booted VM whose blktests units to stop, over vsock-SSH.
      format: dynselect-list_vms
      title: VM Name
  required:
    - vm_name
tag: vm
