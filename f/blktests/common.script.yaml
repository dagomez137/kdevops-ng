summary: blktests share config and result helpers
description: |-
  Library module imported by the `f/blktests/*` steps (`from
  f.blktests.common import share_dir, build_args, parse_seqres, ...`), not a
  runnable step. Holds the host end of the `blktests` virtiofs share: the
  group catalog, the config and `BLKTESTS_ARGS` builders, the result parser
  and tree walker, and the shared verdict rules. The module header states the
  share contract both ends keep. Never contacts the guest.
lock: '!inline f/blktests/common.script.lock'
kind: script
schema:
