summary: Wipe the chosen TEST_DEVS
description: |-
  Per-group device prep: `umount`, then `wipefs --all` and `blkdiscard
  --force`, on each device the user chose as `TEST_DEVS` and on no other.

  Destructive, and doubly gated: `wipe_devices` must be on AND `test_devs`
  non-empty, so the default `nodev` run never touches a disk and no devices
  is a no-op success. Returns `{vm, wiped, failed}`.
lock: '!inline f/blktests/wipe.script.lock'
kind: script
schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  order:
    - vm_name
    - test_devs
    - wipe_devices
  properties:
    test_devs:
      type: array
      description: |-
        The `TEST_DEVS` device nodes to wipe (e.g. `/dev/nvme1n1`). Empty
        wipes nothing.
      default: []
      items:
        type: string
      title: TEST_DEVS
    vm_name:
      type: object
      description: Booted VM whose TEST_DEVS to wipe, over vsock-SSH.
      format: dynselect-list_vms
      title: VM Name
    wipe_devices:
      type: boolean
      description: |-
        `wipefs --all` + `blkdiscard --force` every chosen TEST_DEVS device.
        Off = no-op.
      default: false
      title: Wipe Devices
  required:
    - vm_name
tag: vm
