summary: Create the per-VM NVMe backing files
description: |-
  Create the per-VM NVMe qcow2 backing files under the VM's systemd
  `StateDirectory`, which is also the `qemu-system@<vm>.service`
  `WorkingDirectory=`, so the relative `file=` entries in `<vm>.env` resolve at
  run time. Idempotent: an existing file is left untouched.

  qcow2 only allocates host blocks on write, so a large virtual size is cheap at
  rest. Returns the `state_dir` and the created and skipped file lists.
lock: '!inline f/qsu/nvme/create.script.lock'
kind: script
schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  order:
    - vm_name
    - nvme_drive_count
    - nvme_drive_size_gb
    - nvme_drives_override
  properties:
    nvme_drive_count:
      type: integer
      description: |-
        Number of NVMe qcow2 files to create (`nvme0.qcow2 .. nvme<N-1>.qcow2`).
        0 skips.
      default: 5
      title: NVMe Drive Count
    nvme_drive_size_gb:
      type: integer
      description: Virtual size in GiB passed to `qemu-img create` (`<size>G`).
      default: 20
      title: NVMe Drive Size (GiB)
    nvme_drives_override:
      type: array
      description: |-
        Explicit drive dicts (`{file,format,...}`) to create; overrides
        `nvme_drive_count`.
      default: []
      items:
        type: object
      title: NVMe Drives Override
    vm_name:
      type: string
      description: VM whose `StateDirectory` holds the qcow2 files.
      title: VM Name
  required:
    - vm_name
tag: vm
