summary: Boot a VM
description: |-
  Boot one QEMU-in-systemd VM against the host `systemd --user` manager:
  `daemon-reload` so freshly rendered units are seen, then one `restart` of
  `qemu-system@<vm>`, which applies a re-render in place and simply starts a
  stopped VM. Then poll the forwarded TCP port until sshd greets.

  Returns `{vm_name, ssh_port, vsock_cid, active, ssh_ready, state_dir}`. A unit
  that never reaches `active` raises with the guest's journal tail, so the flow
  fails at boot rather than reporting success on a VM that never came up. Run on
  a `vm`-tagged worker; the unit forks on the host (see
  `notes/windmill/qsu-execution-model.md`).
lock: '!inline f/qsu/boot.script.lock'
kind: script
schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  order:
    - vm_name
    - ssh_port
    - vsock_cid
    - wait_timeout
  properties:
    ssh_port:
      type: integer
      description: Forwarded host port to poll for the guest sshd banner.
      title: SSH Port
    vm_name:
      type: string
      description: systemd instance to start (`qemu-system@<vm_name>`).
      title: VM Name
    vsock_cid:
      type: integer
      description: |-
        Guest vsock cid, surfaced in the access lines (`ssh root@vsock/<cid>`).
      title: VSOCK CID
    wait_timeout:
      type: integer
      description: |-
        Seconds to poll `127.0.0.1:<ssh_port>` for the `SSH-2.0` banner before
        giving up.
      default: 300
  required:
    - vm_name
    - ssh_port
tag: vm
