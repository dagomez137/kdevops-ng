summary: VM vars, render, and systemd helpers
description: |-
  Library module imported by the `f/qsu/*` steps (`from f.qsu.common import
  build_vars, render, store_out, ...`), not a runnable step. Builds the qsu
  template vars from QEMU-keyword inputs and the kernel and closure build
  manifests, renders the vendored qsu `.j2` templates, resolves `/nix/store`
  paths, and exposes the canonical share-tag list.
