summary: Resolve QEMU and virtiofsd store paths
description: |-
  Library module imported by the qsu steps (`from f.qsu.binaries import ...`),
  not a runnable step. Resolves nixos-flake packages to their `/nix/store`
  output paths, picks the qemu and virtiofsd binaries by source, and backs the
  `dynselect-list_iommu` dropdown. Split out of `f.qsu.common` so it stays
  dependency-free for dynselect helpers to import.
lock: '!inline f/qsu/binaries.script.lock'
kind: script
