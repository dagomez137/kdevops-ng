summary: Parse QEMU sanitizer diagnostics
description: |-
  Library module imported by `f/qsu/collect_diagnostics` (`from f.qsu import
  diagnostics`), not a runnable step. Turns a guest's QEMU journal message lines
  into structured sanitizer findings and a verdict, and derives a build's
  sanitizer selection from its store name. Pure: no journal, no systemd, no
  environment, so the parse and verdict rules are tested against fixed strings
  with no instance.
lock: '!inline f/qsu/diagnostics.script.lock'
kind: script
