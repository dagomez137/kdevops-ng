summary: Render the qemu-system unit and env
description: |-
  Render the **qemu-system** component of the QEMU-in-systemd unit set into the
  host user manager's search path (`$HOME/.config/systemd`): the host-wide
  `qemu-system@.service` template and its `qmp-powerdown` helper, written once,
  plus this VM's `<vm>.env` and `qemu-system@<vm>.service.d/override.conf`.

  Inputs are upstream **QEMU flag names**. `qemu_binary`/`virtiofsd_binary`
  default to the `nixos-flake` store paths, so the host-forked unit execs a
  `/nix/store` binary, and the `kernel`/`closure` build manifests supply
  `-kernel`/`-initrd`/`-append` and the `/lib/modules` share.

  Returns the written paths, the composed `shares` and the effective
  `ssh_port`/`vsock_cid`.
lock: '!inline f/qsu/qemu-system/render.script.lock'
kind: script
schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  order:
    - vm_name
    - auto_vm_name
    - cpu
    - accel
    - ram
    - cpus
