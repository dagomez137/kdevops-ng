    - atomic_awupf
    - atomic_nawun
    - atomic_nawupf
    - atomic_nabsn
    - atomic_nabspf
    - atomic_nabo
    - atomic_mam
    - kernel
    - closure
    - emit_vars_yaml_snapshot
  properties:
    accel:
      type: string
      description: |-
        Accelerator (`-accel`); `kvm` needs `/dev/kvm`, `tcg` is pure software,
        `mshv` is the Microsoft Hypervisor.
      default: kvm
      enum:
        - tcg
        - mshv
        - kvm
    atomic_awun:
      type: string
      description: |-
        Atomic Write Unit Normal (AWUN), 0-based, in logical blocks: `-device
        nvme,atomic.awun=`. Empty = QEMU default. Single value or per-drive
        comma-list.
      default: ''
      title: Atomic Write Unit Normal (AWUN)
    atomic_awupf:
      type: string
      description: |-
        Atomic Write Unit Power Fail (AWUPF), 0-based: `-device
        nvme,atomic.awupf=`. Empty = QEMU default. Single value or per-drive
        comma-list.
      default: ''
      title: Atomic Write Unit Power Fail (AWUPF)
    atomic_dn:
      type: boolean
      description: |-
        Disable Normal (DN): `-device nvme,atomic.dn=`. Set = AWUN/NAWUN
        disabled, so AWUPF/NAWUPF govern atomicity for all writes. Off = QEMU
        default.
      default: false
      title: Disable Normal (DN)
    atomic_mam:
      type: boolean
      description: |-
        Multiple Atomicity Mode (MAM): `-device nvme-ns,atomic.mam=on`. Set =
        Identify-Namespace NSFEAT bit 6 on every namespace, advertising the
        atomic boundary alongside the atomic write unit (needs the
        per-namespace NAWUN/NAWUPF geometry, boundary equal to unit, NABO=0).
        Off = QEMU default (Single Atomicity Mode).
      default: false
      title: Multiple Atomicity Mode (MAM)
    atomic_nabo:
      type: string
      description: |-
        Namespace Atomic Boundary Offset (NABO): `-device nvme-ns,atomic.nabo=`.
        Forces explicit-namespace mode. Empty = QEMU default. Single value or
        per-drive comma-list.
      default: ''
      title: Namespace Atomic Boundary Offset (NABO)
    atomic_nabsn:
      type: string
      description: |-
        Namespace Atomic Boundary Size Normal (NABSN): `-device
        nvme-ns,atomic.nabsn=`. Forces explicit-namespace mode. Empty = QEMU
        default. Single value or per-drive comma-list.
      default: ''
      title: Namespace Atomic Boundary Size Normal (NABSN)
    atomic_nabspf:
      type: string
      description: |-
        Namespace Atomic Boundary Size Power Fail (NABSPF): `-device
        nvme-ns,atomic.nabspf=`. Forces explicit-namespace mode. Empty = QEMU
        default. Single value or per-drive comma-list.
      default: ''
      title: Namespace Atomic Boundary Size Power Fail (NABSPF)
    atomic_nawun:
      type: string
      description: |-
        Namespace Atomic Write Unit Normal (NAWUN), 0-based: `-device
        nvme-ns,atomic.nawun=`. Setting any per-namespace atomic switches the
        drive to explicit `-device nvme` + `-device nvme-ns`. Empty = QEMU
        default. Single value or per-drive comma-list.
      default: ''
      title: Namespace Atomic Write Unit Normal (NAWUN)
    atomic_nawupf:
      type: string
      description: |-
        Namespace Atomic Write Unit Power Fail (NAWUPF), 0-based: `-device
        nvme-ns,atomic.nawupf=`. Forces explicit-namespace mode. Empty = QEMU
        default. Single value or per-drive comma-list.
      default: ''
      title: Namespace Atomic Write Unit Power Fail (NAWUPF)
    auto_vm_name:
      type: boolean
      description: |-
        Derive the VM name from the flow job id (`vm-<job-id>`) so each run is
        unique and collision-free. Off = use `vm_name`.
      default: true
      title: Auto VM Name
    closure:
      type: object
      description: |-
        The `f/nix/build_closure` result manifest (`toplevel`, `init`,
        `initrd`).
      default: {}
    cmb_size_mb:
      type: string
      description: |-
        Controller Memory Buffer size in MiB: `-device nvme,cmb_size_mb=` (host
        RAM exposed on PCI BAR 2; coexists with PMR on BAR 4/5). Empty = no CMB.
        Single value or per-drive comma-list (`64,0` = drive 0 only).
      default: ''
      title: CMB Size (MiB)
    controller_share:
      type: boolean
      description: |-
        Append one operator-defined virtiofs share exposing a controller
        directory to the guest.
      default: false
    controller_share_dir:
      type: string
      description: Absolute controller path to share. Empty = `$HOME`.
      default: ''
    controller_share_guest_mount:
      type: string
      description: |-
        Guest mount point for the controller share. Empty = same as the
        controller path.
      default: ''
    controller_share_readwrite:
      type: boolean
      description: Mount the controller share read-write (default read-only).
      default: false
    controller_share_tag:
      type: string
      description: |-
        virtiofs tag for the controller share (must be unique across the guest's
        shares).
      default: controller-share
    cpu:
      type: string
      description: |-
        Guest CPU model (`-cpu`); `host` needs KVM, `max` enables all features
        the accelerator supports. List reflects the default reproducible QEMU. A
        different `qemu_source` may differ; QEMU validates the value at boot.
      default: host
      enum:
        - '486'
        - 486-v1
        - Broadwell
        - Broadwell-IBRS
        - Broadwell-noTSX
        - Broadwell-noTSX-IBRS
        - Broadwell-v1
        - Broadwell-v2
        - Broadwell-v3
        - Broadwell-v4
