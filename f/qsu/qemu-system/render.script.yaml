        - EPYC-Milan-v1
        - EPYC-Milan-v2
        - EPYC-Milan-v3
        - EPYC-Rome
        - EPYC-Rome-v1
        - EPYC-Rome-v2
        - EPYC-Rome-v3
        - EPYC-Rome-v4
        - EPYC-Rome-v5
