      title: CPU
    cpus:
      type: integer
      description: Guest vCPU count, passed to QEMU `-smp`.
      default: 4
      title: CPUs
    custom_virtiofsd:
      type: boolean
      description: |-
        Use a custom `virtiofsd` instead of the reproducible `nixos-flake` one.
      default: false
      title: Custom virtiofsd
    detect_zeroes:
      type: string
      description: |-
        Convert all-zero guest writes on the image backend: `-drive
        detect-zeroes=`. `unmap` turns them into deallocations (needs `discard`
        set to `unmap`, which QEMU enforces at image open), `on` turns them into
        write-zeroes, empty = QEMU default (`off`). Leave it off for write
        benchmarks, where it would silently retire a zero-fill as a discard.
        Single value or per-drive comma-list.
      default: ''
      title: Detect Zeroes
    discard:
      type: string
      description: |-
        Honour guest deallocations on the image backend: `-drive discard=`.
        `unmap` passes NVMe DSM deallocate and TRIM through, so `fstrim`, a
        discarding `mkfs`, and file deletion release the qcow2 clusters and the
        image stops growing to its virtual size. `off` makes QEMU drop them
        silently, leaving every touched cluster allocated forever. Single value
        or per-drive comma-list.
      default: unmap
      title: Discard
    discard_granularity:
      type: string
      description: |-
        Discard granularity in bytes: `-device nvme-ns,discard_granularity=`
        (BlockConf). Single value or per-drive comma-list.
      default: '4096'
      title: Discard Granularity
    emit_vars_yaml_snapshot:
      type: boolean
      description: |-
        Also write the debug `<vm>.yaml` vars snapshot under the qsu vars dir.
      default: false
      title: Emit Vars YAML Snapshot
    fstests:
      type: boolean
      description: |-
        Predefined `fstests` share (auto): serve
        `$WORKERS_DIR/shared/fstests/<vm>` at `/var/lib/xfstests` (rw), tag
        `fstests`. Set automatically by `f/qsu/bringup` when the closure's test
        suites include `fstests`; no manual knob.
      default: false
    home_share:
      type: boolean
      description: |-
        Predefined `home` share: serve the operator's host `$HOME` into the
        guest at the same absolute path, tag `home`. Tag/dir/guest-mount are
        inferred; only read-write is configurable.
      default: false
      title: Home Share
    home_share_readwrite:
      type: boolean
      description: Mount the home share read-write (default read-only).
      default: false
      title: Home Share Readwrite
    ioeventfd:
      type: string
      description: |-
        Deliver I/O queue doorbell writes through an eventfd: `-device
        nvme,ioeventfd=`. `on`, the default here, signals the main loop and
        leaves the vCPU thread in the guest; `off`, which is QEMU's own
        default, traps every write out to userspace on the vCPU thread. Admin
        queue doorbells always take the exit. Single value or per-drive
        comma-list.
      default: 'on'
      title: Doorbell eventfd
    driver:
      type: string
      description: |-
        Block driver behind the drive instead of an image file: `-drive
        driver=`. `null-co`, the default here, answers every request in the
        block layer without touching storage: the fastest drive QEMU can
        emulate, and no place for a filesystem, since writes go nowhere and
        reads come back zeroed. `null-aio` is the same from the AIO path. Empty
        = an image file. Single value or per-drive comma-list.
      default: null-co
      title: Backing Driver
    format:
      type: string
      description: |-
        Image format: `-drive format=`. The backing file is named for it, so
        `raw` gives `nvme0.raw`. Ignored on a drive that has a `driver`. Single
        value or per-drive comma-list.
      default: qcow2
      title: Image Format
    aio:
      type: string
      description: |-
        How QEMU submits the image's I/O to the host: `-drive aio=`.
        `threads` is a worker pool, `native` is Linux AIO and needs an O_DIRECT
        cache mode, `io_uring` is io_uring. Empty = QEMU default. Single value
        or per-drive comma-list.
      default: ''
      title: AIO Mode
    cache:
      type: string
      description: |-
        Host cache mode for the image: `-drive cache=`. `writeback` is QEMU's
        default, `none` and `directsync` open the file O_DIRECT, `unsafe` drops
        flushes. Empty = QEMU default. Single value or per-drive comma-list.
      default: ''
      title: Cache Mode
    aio_max_batch:
      type: string
      description: |-
        Largest number of requests QEMU hands the host engine at once:
        `-drive file.aio-max-batch=`, which is where the option lives: QEMU
        rejects the bare spelling on any drive that names a format, and on a
        driver that has no file at all. Empty = the engine's own default.
        Single value or per-drive comma-list.
      default: ''
      title: AIO Max Batch
    read_zeroes:
      type: string
      description: |-
        Whether a read from a null driver fills the guest buffer: `-drive
        read-zeroes=`. Defaults to `on` on those drives, because a read that
        leaves memory untouched costs less than a memset and is not comparable
        with a device. Single value or per-drive comma-list.
      default: ''
      title: Read Zeroes
    latency_ns:
      type: string
      description: |-
        Delay a null driver adds to every request, in nanoseconds: `-drive
        latency-ns=`. Empty = no delay, which is the only setting with no
        device in it. Single value or per-drive comma-list.
      default: ''
      title: Latency (ns)
    max_ioqpairs:
      type: string
      description: |-
        I/O queue pairs the controller offers: `-device
        nvme,max_ioqpairs=`. Empty = QEMU default. Single value or per-drive
        comma-list.
      default: ''
      title: Max I/O Queue Pairs
    msix_qsize:
      type: string
      description: |-
        MSI-X table size: `-device nvme,msix_qsize=`. Empty = QEMU default.
        Single value or per-drive comma-list.
      default: ''
      title: MSI-X Queue Size
    mqes:
      type: string
      description: |-
        Maximum Queue Entries Supported, 0-based: `-device nvme,mqes=`.
        Empty = QEMU default. Single value or per-drive comma-list.
      default: ''
      title: Maximum Queue Entries (MQES)
    dbcs:
      type: string
      description: |-
        Doorbell Buffer Config support: `-device nvme,dbcs=`. QEMU defaults
        it on, which lets the guest keep its doorbells in a shared buffer and
        write the register less often. Single value or per-drive comma-list.
      default: ''
      title: Shadow Doorbells (DBCS)
    iommu:
      type: object
      description: |-
        vIOMMU device for `-device`, queried from the chosen qemu's `-device
        help` and narrowed to what the template renders (`intel-iommu`,
        `amd-iommu`, `virtio-iommu-pci`, `arm-smmuv3`). `none` = no vIOMMU.
      default: ''
      format: dynselect-list_iommu
      title: IOMMU
    kernel:
      type: object
      description: |-
        The `f/kernel/build` result manifest (`vmlinuz`/`bzImage`,
        `modules_dir`, `uts_release`).
      default: {}
    kernel_append:
      type: string
      description: |-
        Kernel cmdline for `-append`. Empty = `root=tmpfs ...
        init=<closure.init>`.
      default: ''
    kernel_image:
      type: string
      description: |-
        Kernel image for `-kernel`. Empty = `kernel.vmlinuz`/`kernel.bzImage`
        from the build manifest.
      default: ''
    kernel_initrd:
      type: string
      description: |-
        initrd for `-initrd`. Empty = `closure.initrd` (the imageless closure's
        bootspec initrd).
      default: ''
    extra_kernel_parameters:
      type: string
      description: |-
        Extra kernel parameters the curated list above does not carry,
        space separated, appended after it. This is how a device emulator
        gets its physical carve-out: `memmap=16M$0x17F000000` reserves the
        top of the guest's high RAM window so a framework such as pciem can
        claim it. Check the guest's own `/proc/iomem` before choosing an
        address; the window differs per machine, and on this shape
        `0x80000000` is PCI hole rather than RAM.
      default: ''
      title: Extra Kernel Parameters
    extra_qemu_args:
      type: string
      description: |-
        Extra QEMU flags appended verbatim to the composed command line,
        after everything it defines, so a device here can reference a
        chardev, bus or object above it. This is how a guest gets a device
        the form does not model: a vfio-user client, for instance, needs
        `-device pcie-root-port,id=rp0,bus=pcie.0,chassis=1,slot=1 -device
        vfio-user-pci,bus=rp0,socket=<path>`. Unvalidated: a wrong flag
        fails the guest at start, visible in the unit's journal.
      default: ''
      title: Extra QEMU Arguments
    kernel_parameters:
      type: array
      description: |-
        Curated extra kernel parameters, appended after the composed cmdline
        (e.g. `kunit.autorun=1`).
      default: []
      items:
        type: string
      title: Kernel Parameters
    legacy_cmb:
      type: boolean
      description: |-
        Use the NVMe 1.3 CMB register scheme (CMBLOC/CMBSZ always enabled):
        `-device nvme,legacy-cmb=on`. Off = the 1.4 CMB scheme. Applies to every
        CMB-enabled drive; no effect without `cmb_size_mb`.
      default: false
      title: Legacy CMB (v1.3)
    logical_block_size:
      type: string
      description: |-
        Logical block (LBA) size in bytes: `-device nvme-ns,logical_block_size=`
        (BlockConf). `4096` = 4Kn, `512` = 512-byte sectors. Single value (all
        drives) or per-drive comma-list (`4096,512`).
      default: '4096'
      title: Logical Block Size
    machine_type:
      type: string
      description: |-
        Machine type (`-machine type=`); `q35` is the modern PC, `microvm` is a
        minimal machine, `pc-i440fx-*` are legacy boards.
      default: q35
      enum:
        - microvm
        - nitro-enclave
        - pc-i440fx-9.2
        - pc-i440fx-9.1
        - pc-i440fx-9.0
        - pc-i440fx-8.2
        - pc-i440fx-8.1
        - pc-i440fx-8.0
        - pc-i440fx-7.2
        - pc-i440fx-7.1
        - pc-i440fx-7.0
        - pc-i440fx-6.2
        - pc-i440fx-6.1
        - pc-i440fx-6.0
        - pc-i440fx-5.2
        - pc-i440fx-5.1
        - pc-i440fx-5.0
        - pc
        - pc-i440fx-10.2
        - pc-i440fx-10.1
        - pc-i440fx-10.0
        - pc-q35-9.2
        - pc-q35-9.1
        - pc-q35-9.0
        - pc-q35-8.2
        - pc-q35-8.1
        - pc-q35-8.0
        - pc-q35-7.2
        - pc-q35-7.1
        - pc-q35-7.0
        - pc-q35-6.2
        - pc-q35-6.1
        - pc-q35-6.0
        - pc-q35-5.2
        - pc-q35-5.1
        - pc-q35-5.0
        - q35
        - pc-q35-10.2
        - pc-q35-10.1
        - pc-q35-10.0
        - isapc
        - none
        - x-remote
    mdts:
      type: string
      description: |-
        Maximum Data Transfer Size (MDTS) as a power of two in MPSMIN units:
        `-device nvme,mdts=`. `9`, the default here, is 2 MiB and QEMU's current
        ceiling; its own default of `7` splits a 1 MiB request into two
        commands. Empty = QEMU default. Single value or per-drive comma-list.
      default: '9'
      title: Maximum Data Transfer Size (MDTS)
    min_io_size:
      type: string
      description: |-
        Minimum I/O size hint in bytes: `-device nvme-ns,min_io_size=`
        (BlockConf). Single value or per-drive comma-list.
      default: '4096'
      title: Minimum I/O Size
    modules_dir:
      type: string
      description: |-
        Host modules tree shared into the guest at `/lib/modules`. Empty =
        `kernel.modules_dir`.
      default: ''
    nvme_drive_count:
      type: integer
      description: |-
        Number of NVMe `-device nvme` drives to emit (backing files created by
        nvme/create).
      default: 5
      title: NVMe Drive Count
    nvme_drive_size_gb:
      type: integer
      description: |-
        Virtual size in GiB of each drive: the image nvme/create lays down, and
        the size a null driver reports.
      default: 20
      title: Drive Size (GiB)
    opt_io_size:
      type: string
      description: |-
        Optimal I/O size hint in bytes: `-device nvme-ns,opt_io_size=`
        (BlockConf). Single value or per-drive comma-list.
      default: '4096'
      title: Optimal I/O Size
    physical_block_size:
      type: string
      description: |-
        Physical block size in bytes: `-device nvme-ns,physical_block_size=`
        (BlockConf). Single value or per-drive comma-list.
      default: '4096'
      title: Physical Block Size
    pmr_pmem:
      type: boolean
      description: |-
        Real persistent-memory flush semantics for the PMR backing file
        (`-object memory-backend-file,pmem=on`). Off = QEMU default. Applies to
        every PMR-enabled drive.
      default: false
      title: PMR pmem
    pmr_share:
      type: boolean
      description: |-
        Write guest PMR contents through to the backing file (`-object
        memory-backend-file,share=on`) so they survive a restart. Off = volatile
        (`share=off`, MAP_PRIVATE). Applies to every PMR-enabled drive.
      default: true
      title: PMR Persistent (share=on)
    pmr_size:
      type: string
      description: |-
        Persistent Memory Region size in bytes: `-object
        memory-backend-file,size=` linked from `-device nvme,pmrdev=`. Must be a
        power of 2 and at least 16. Empty = no PMR. Single value or per-drive
        comma-list (`16777216,0` = drive 0 only).
      default: ''
      title: PMR Size (bytes)
    qemu_binary:
      type: string
      description: |-
        Path to the `qemu-system-*` from `f/qemu/build` (its destdir `bin/`).
      default: ''
      showExpr: fields.qemu_source === "qemu-build"
      title: QEMU Binary
    qemu_source:
      type: string
      description: |-
        Where the emulator comes from: `nixpkgs` (the `qemu` package from
        `nixpkgs`, provided by the vendored `nixos-flake`) or `qemu-build` (a
        binary from `f/qemu/build`).
      default: nixpkgs
      enum:
        - nixpkgs
        - qemu-build
      title: QEMU Source
    ram:
      type: integer
      description: Guest RAM in MB, passed to QEMU `-m`.
      default: 4096
      title: RAM
    selftests:
      type: boolean
      description: |-
        Predefined `selftests` share (auto): serve
        `$WORKERS_DIR/shared/selftests/<vm>` at `/var/lib/kselftests` (rw), tag
        `selftests`. Set automatically by `f/qsu/bringup` when the closure's
        test suites include `selftests`; no manual knob.
      default: false
    shares:
      type: array
      description: |-
        Explicit virtiofs shares (`{tag,dir,mount,options}`); overrides the
        composed
        store/modules/fstests/selftests/usertests/blktests/home/controller
        set.
      default: []
      items:
        type: object
    ssh_port:
      type: integer
      description: |-
        Host port forwarded to guest `:22` via `-nic user,hostfwd=`. Empty =
        `ssh_port_base + vm_index`.
      title: SSH Port
    ssh_port_base:
      type: integer
      description: Base host port; guest N forwards `ssh_port_base + vm_index`.
      default: 10022
      title: SSH Port Base
    usertests:
      type: boolean
      description: |-
        Predefined `usertests` share (auto): serve
        `$WORKERS_DIR/shared/usertests/<vm>` at `/var/lib/usertests` (rw), tag
        `usertests`. Set automatically by `f/qsu/bringup` when the closure's
        test suites include `usertests`; no manual knob.
      default: false
    blktests:
      type: boolean
      description: |-
        Predefined `blktests` share (auto): serve
        `$WORKERS_DIR/shared/blktests/<vm>` at `/var/lib/blktests` (rw), tag
        `blktests`. Set automatically by `f/qsu/bringup` when the closure's
        test suites include `blktests`; no manual knob.
      default: false
      title: blktests
    virtiofsd_binary:
      type: string
      description: |-
        Path to a custom `virtiofsd` (e.g. a nix derivation output or your own
        build).
      default: ''
      showExpr: fields.custom_virtiofsd === true
      title: virtiofsd Binary
    vm_index:
      type: integer
      description: |-
        Index added to `ssh_port_base`/`vsock_cid_base` when the explicit
        port/cid is unset.
      default: 0
      title: VM Index
    vm_name:
      type: string
      description: |-
        systemd instance name (`qemu-system@<vm_name>`) and machined machine
        name. Used when `auto_vm_name` is off.
      showExpr: fields.auto_vm_name === false
      title: VM Name
    vsock_cid:
      type: integer
      description: |-
        vsock context id for `-device vhost-vsock`. Empty = `vsock_cid_base +
        vm_index`.
      title: VSOCK CID
    vsock_cid_base:
      type: integer
      description: Base vsock cid; guest N uses `vsock_cid_base + vm_index`.
      default: 100
      title: VSOCK CID Base
    write_cache:
      type: string
      description: |-
        Volatile Write Cache (VWC): `-device nvme-ns,write-cache=` (BlockConf):
        `on`, `off` or `auto`. Empty = QEMU default. Single value or per-drive
        comma-list.
      default: ''
      title: Write Cache (VWC)
  required:
    - vm_name
tag: vm
