summary: Aggregate harness results into a verdict
description: |-
  Fold the per-item `f/usertests/collect` results into one rollup, `passed`
  only when every item passed. Returns a Windmill `render_all` of three native
  tables: run info, one row per harness (counts stay 0 for the silent and bench
  entries, whose verdict is not printed counts), and one row per check across
  all items, failures first. With a `vm_name` it also writes the rollup to
  `<share>/<kver>/report.json`. The host never contacts the guest.
lock: '!inline f/usertests/report.script.lock'
kind: script
schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  order:
    - per_item
    - vm_name
  properties:
    per_item:
      type: array
      description: |-
        The `f/usertests/collect` result objects, one per run item, to
        aggregate.
      default: []
      items:
        type: object
      title: Per Item
    vm_name:
      type: string
      description: |-
        Optional: when set, also write the rollup to
        `$WORKERS_DIR/shared/usertests/<vm>/<kver>/report.json`.
      default: ''
      title: VM Name
  required:
    - per_item
tag: vm
