summary: Aggregate harness results into a verdict
description: |-
  Fold the list of `f/usertests/collect` results (one per run item) into one
  rollup, with a `status` of `passed` only when every item passed (a failed
  or crashed item fails the run, and so does an empty item list; `run_status`
  is the one rule shared with `f/usertests/judge`). Returns a Windmill
  `render_all` of three native tables (no markdown): run info (testsuite,
  kernel, guest, harnesses, time(s)), one row per harness (harness, tests,
  passed, failed, time(s), status; the counts stay 0 for the silent and bench
  entries), and one row per check across all items (failures first; a passing
  `radix-tree/main` row carries its captured random seed). When `vm_name` is
  given it also writes the structured rollup to
  `$WORKERS_DIR/shared/usertests/<vm>/<kver>/report.json`. The host never
  contacts the guest.
lock: '!inline f/usertests/report.script.lock'
kind: script
schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  order:
    - per_item
    - vm_name
  properties:
    per_item:
      type: array
      description: |-
        The `f/usertests/collect` result objects, one per run item, to
        aggregate.
      default: []
      items:
        type: object
      title: Per Item
    vm_name:
      type: string
      description: |-
        Optional: when set, also write the rollup to
        `$WORKERS_DIR/shared/usertests/<vm>/<kver>/report.json`.
      default: ''
      title: VM Name
  required:
    - per_item
tag: vm
