summary: Wait for a usertests harness to finish
description: |-
  Poll the guest's journal for the unit `f/usertests/start` started, reading
  only entries past start's cursor, until systemd's job-outcome record
  appears: PID1 logs exactly one of "Finished <unit>" (`result=done`) or
  "Failed to start <unit>" (`result=failed`) per start job, and "Stopped" when
  an outside stop ended it. The same records carry the harness's line-buffered
  output and the unit's process exits, so the returned `output` is the
  run-scoped text `f/usertests/collect` parses and `exec_status` carries a
  failing harness's exit status or signal when there is one (successful exits
  are journal-logged only at debug level, so a clean run leaves it empty). The
  `ExecStart` carries no `-` prefix, so exit codes are REAL: an assert or
  sanitizer abort arrives as `result=failed` with `exec_status` populated, and
  that IS the test failure.

  Each poll also checks the host `qemu-system@<vm>.service`: any not-alive
  state means the guest is gone and the wait ends with `crashed` set. On
  expiry of the timeout the unit is stopped (`timed_out`).

  Returns `{vm, item, unit, result, exec_status, output, crashed, timed_out,
  runtime, started_realtime_ms, ended_realtime_ms}` (the `*_realtime_ms` pair
  is the run's wall-clock window in milliseconds since the epoch, from the
  journal records' `__REALTIME_TIMESTAMP`; null when the record is missing).
lock: '!inline f/usertests/wait.script.lock'
kind: script
schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  order:
    - vm_name
    - item
    - unit
    - cursor
    - timeout
    - poll_interval
    - stream_logs
  properties:
    cursor:
      type: string
      description: |-
        The guest journal cursor `f/usertests/start` captured before starting
        the unit; bounds every read to this run.
      title: Cursor
    item:
      type: string
      description: |-
        Harness being waited on (a `<dir>/<binary>` MANIFEST item).
      title: Item
    poll_interval:
      type: integer
      description: |-
        Seconds between journal polls (and the host liveness check).
      default: 10
      title: Poll Interval
    stream_logs:
      type: boolean
      description: |-
        Each poll, print the guest's new unit + kernel journal (merged) into
        the job log. Off = only a bounded journal tail at the end.
      default: true
      title: Stream Logs
    timeout:
      type: integer
      description: |-
        Maximum seconds to wait for the harness to finish before giving up
        (`timed_out`). The unit is `TimeoutStartSec=infinity`, so this
        deadline is the only bound on the run.
      default: 1200
      title: Timeout
    unit:
      type: string
      description: |-
        The unit `f/usertests/start` started (`usertests@<instance>.service`).
      title: Unit
    vm_name:
      type: object
      description: Booted VM whose harness to wait on, over vsock-SSH.
      format: dynselect-list_vms
      title: VM Name
  required:
    - vm_name
    - item
    - unit
    - cursor
tag: vm-run
