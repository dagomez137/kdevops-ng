summary: Discover a guest's usertests readiness over SSH
description: |-
  Reach a booted guest over vsock-SSH and report whether it is ready to run the
  kernel's userspace test harnesses, and which ones its kernel build published:
  the running kernel release, the `usertests-<kver>` tree in the local Nix
  store, and the run items its `MANIFEST` lists.

  Returns `{vm, host, booted, kernel_version, store_path, harnesses}`, and
  writes the harness list to the per-VM picker cache. Fails fast when the guest
  is not usertests-ready, when no tree is published for the running kernel
  (build that kernel with the Usertests group), or when the MANIFEST is empty.
  Mutates nothing on the guest.
lock: '!inline f/usertests/discover.script.lock'
kind: script
schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  order:
    - vm_name
  properties:
    vm_name:
      type: object
      description: Booted VM to probe over vsock-SSH for usertests readiness.
      format: dynselect-list_vms
      title: VM Name
  required:
    - vm_name
tag: vm
