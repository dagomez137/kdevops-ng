summary: Harness catalog, verdict rules and harness listing
description: |-
  Library module imported by the `f/usertests/*` steps (`from
  f.usertests.common import catalog_entry, item_unit, list_harnesses, ...`),
  not a runnable step. Curates the kernel tree's userspace test harnesses and
  their upstream verdict conventions, escapes items into `usertests@` unit
  instances, composes each harness's ARGS, lists the built harnesses from the
  per-VM cache, and writes the run's rollup onto the shared `usertests` tree.
  The module header states the item model and where the verdict rules live.
  Never contacts the guest.
lock: '!inline f/usertests/common.script.lock'
kind: script
schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  order: []
  properties: {}
  required: []
