summary: Lock a per-VM imageless config
description: |-
  Materialise `flake.lock` for a per-VM imageless config so the closure builds
  reproducibly. The local `<pkg>-src` source overrides are re-locked to their
  branch tip on every build, so a freshly committed patch in the checkout lands
  in the next closure with no manual lock bump.

  Set `update` to re-pin the vendored nixos-flake after it has changed. Reads
  `config_dir` from a prior `render_config` step.
lock: '!inline f/nix/lock_config.script.lock'
kind: script
schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  order:
    - config_dir
    - update
  properties:
    config_dir:
      type: string
      description: Per-VM config directory (from render_config).
    update:
      type: boolean
      description: |-
        Refresh the nixos-flake input pin instead of only filling missing lock
        entries.
      default: true
  required:
    - config_dir
