summary: Render a per-VM imageless config
description: |-
  Render a per-VM imageless NixOS configuration under
  `$WORKERS_DIR/$WORKER_INDEX/nix/<vm_name>/`: the Windmill equivalent of
  kdevops's `nixosfi` generate-configs phase.

  - `flake.nix` is a near-verbatim copy of the vendored imageless **template**
  (`vendor/nixos-flake/templates/imageless/flake.nix`); only the `nixos-flake`
  path input is set, plus one `<pkg>-src` non-flake input per source override.
  The closure it builds is therefore byte-for-byte what kdevops builds. -
  `default.nix` is generated from the typed inputs and carries the per-VM
  composition: which `profiles.*` / `testSuites.*` / `mounts.shares` to import,
  the hostname, SSH keys, virtiofs shares, and package source overrides. The
  flake's modules list already imports the imageless backend + user + overlay,
  so this file only adds to that.

  Both files are echoed to the job log. Returns `config_dir` for the lock/build
  steps.
lock: '!inline f/nix/render_config.script.lock'
kind: script
schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  order:
    - vm_name
    - profiles
    - test_suites
    - telemetry_metrics_url
    - telemetry_logs_url
    - telemetry_collectors
    - telemetry_ebpf
    - telemetry_ebpf_configs
    - ssh_keys
    - shares
    - home
    - home_dir
    - source_overrides
    - extra_overrides
    - user_name
  properties:
    extra_overrides:
      type: array
      description: |-
        Raw [{pkg, src, ref?, attrs?}] for any nixpkgs package not in the
        curated list above. Merged with the form overrides.
      default: []
      items:
        type: object
      title: 'Advanced: arbitrary package overrides'
    home:
      type: boolean
      description: |-
        Predefined `home` share: mount the operator's host home into the guest
        at the same absolute path (tag `home`). Resolved on the worker;
        `home_dir` overrides. Pair with `File Sharing → Home Share` so the host
        serves it.
      default: false
    home_dir:
      type: string
      description: |-
        Override the home-share path (else the worker's `$HOME`). Must match
        what `f/qsu` serves.
      default: ''
      title: Home Dir
    source_overrides:
      type: object
      description: |-
        Rebuild a package from a ref in its project's Bare instead of its
        pinned version. Fill a package's Ref (a branch such as
        mirror/for-next, a tag, or a full commit id); blank keeps the pinned
        version. The flake's build recipe is kept and the known extra build
        steps (e.g. xfsprogs from git) are applied for you. For any other
        nixpkgs package, or a raw path/URL source, use the advanced field
        below.
      default: {}
      order:
        - xfstests
        - xfsprogs
        - fio
        - libbpf-tools
        - blktests
      properties:
        xfstests:
          type: object
          default: {}
          title: xfstests
          order:
            - ref
          properties:
            ref:
              type: string
              default: ''
              title: xfstests Ref
        xfsprogs:
          type: object
          default: {}
          title: xfsprogs
          order:
            - ref
          properties:
            ref:
              type: string
              default: ''
              title: xfsprogs Ref
        fio:
          type: object
          default: {}
          title: fio
          order:
            - ref
          properties:
            ref:
              type: string
              default: ''
              title: fio Ref
        libbpf-tools:
          type: object
          default: {}
          title: libbpf-tools
          order:
            - ref
          properties:
            ref:
              type: string
              default: ''
              title: libbpf-tools Ref
        blktests:
          type: object
          default: {}
          title: blktests
          order:
            - ref
          properties:
            ref:
              type: string
              default: ''
              title: blktests Ref
      title: Package source overrides
    profiles:
      type: array
      description: |-
        nixos-flake profile modules to import (fully featured by default; pare
        back for a lighter closure). controller is a host role and off by
        default. telemetry is off by default; it pushes metrics and the journal
        to the monitoring stack.
      default:
        - devel
        - build-tools
        - monitoring
      items:
        type: string
        enum:
          - build-tools
          - controller
          - devel
          - monitoring
          - telemetry
    shares:
      type: object
      description: |-
        virtiofs shares keyed by guest mount point, e.g. {"/mnt/home": {"tag":
        "home", "options": ["ro"]}}. The `fstests` mount (`/var/lib/xfstests`)
        is added automatically when `test_suites` includes `fstests`; `home`
        adds the operator's home. Both coexist with explicit entries here.
      default: {}
    ssh_keys:
      type: array
      description: Authorized SSH keys for the root and unprivileged accounts.
      default: []
      items:
        type: string
      title: SSH Keys
    telemetry_collectors:
      type: array
      description: |-
        node_exporter collectors the telemetry profile enables on top of its
        defaults; all five are disabled in node_exporter by default. buddyinfo
        exposes the buddy allocator's per-order free block counts, zoneinfo the
        per-zone counters, and meminfo_numa the per-NUMA-node meminfo. That
        profile is off by default.
      default: []
      items:
        type: string
        enum:
          - buddyinfo
          - zoneinfo
          - meminfo_numa
          - processes
          - interrupts
      title: Extra collectors
    telemetry_ebpf:
      type: boolean
      description: |-
        Run ebpf_exporter on the guest and stream its metrics through the same
        push pipeline. The kernel must expose BTF (/sys/kernel/btf/vmlinux).
        Applies only with the telemetry profile, which is off by default.
      default: false
      title: eBPF exporter
    telemetry_ebpf_configs:
      type: array
      description: |-
        ebpf_exporter example configs to load when the eBPF exporter is on.
        biolatency exports block I/O latency histograms; bio-trace per-request
        traces. Applies only with the telemetry profile, which is off by
        default.
      default:
        - biolatency
      items:
        type: string
        enum:
          - biolatency
          - bio-trace
      title: eBPF configs
    telemetry_logs_url:
      type: string
      description: |-
        Loki push API endpoint the telemetry profile ships the journal to. The
        default reaches the guest's own host over the QEMU user network. That
        profile is off by default, and ships only if a monitoring stack is
        listening at the endpoint.
      default: http://10.0.2.2:3100/loki/api/v1/push
      title: Logs push URL
    telemetry_metrics_url:
      type: string
      description: |-
        Prometheus remote_write endpoint the telemetry profile pushes metrics
        to. The default reaches the guest's own host over the QEMU user network.
        That profile is off by default, and pushes only if a monitoring stack is
        listening at the endpoint.
      default: http://10.0.2.2:9090/api/v1/write
      title: Metrics push URL
    test_suites:
      type: array
      description: |-
        nixos-flake testSuite modules to import (all by default; pare back for a
        lighter closure).
      default:
        - blktests
        - fstests
        - gitr
        - kunit
        - ltp
        - mmtests
        - pynfs
        - selftests
        - sysbench
        - usertests
      items:
        type: string
        enum:
          - blktests
          - fstests
          - gitr
          - kunit
          - ltp
          - mmtests
          - pynfs
          - selftests
          - sysbench
          - usertests
    user_name:
      type: string
      description: |-
        Unprivileged account name in the guest (nixos-flake.user.name).
      default: kdevops
    vm_name:
      type: string
      description: Guest hostname and per-VM config directory name.
      default: nixos
      title: VM Name
  required:
    - vm_name
