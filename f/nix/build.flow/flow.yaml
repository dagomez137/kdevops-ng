summary: Build the NixOS closure
description: |-
  Build a NixOS system with Nix: the `build` flow for the nix side, the way
  `f/kernel/build` builds a kernel and `f/qemu/build` builds an emulator. Today
  it builds the **imageless** product: a `toplevel` system whose *closure*
  (every store path it references) a VM boots over virtiofs (tmpfs root,
  `/nix/store` and `/lib/modules` shared from the host). Other products (e.g. a
  disk-image `libvirt` system) could be added under this same flow later. This
  is the Windmill reimplementation of kdevops's `nixosfi` role; booting the
  closure is the qsu half (parked: see notes/windmill/qsu-execution-model.md).

  Steps (pinned to one worker via `same_worker`, so each sees the previous
  step's per-VM config directory under
  `$WORKERS_DIR/$WORKER_INDEX/nix/<vm_name>/`):

  1. `render_config`: write `flake.nix` (from the vendored imageless template) +
  `default.nix` (composed from the typed inputs: profiles, testSuites, shares,
  SSH keys, source overrides). 2. `lock_config`: `nix flake lock` the per-VM
  config for reproducibility. 3. `build_closure`: `nix build .#toplevel` and
  read the bootspec (`init`/`initrd`) from `boot.json`.

  By default the system is fully featured: every guest profile (devel,
  build-tools, monitoring) and all eight test suites. `controller` is a host
  role (it pulls in libvirtd) and is off by default. Pare
  `profiles`/`test_suites` back for a lighter, faster build.

  Returns `{toplevel, init, initrd, config_dir}`. This flow is self-contained;
  pairing the closure with a kernel is a qsu concern, not an input here.
value:
  modules:
    - id: render_config
      summary: Render flake.nix + default.nix
      value:
        type: script
        input_transforms:
          home:
            type: javascript
            expr: flow_input.guest?.home
          home_dir:
            type: javascript
            expr: flow_input.guest?.home_dir
          source_overrides:
            type: javascript
            expr: 'Object.fromEntries(Object.entries(flow_input.closure?.source_overrides
              ?? {}).map(([p, o]) => [p, { ref: o?.custom_ref ? (o?.git_ref ?? "")
              : (o?.ref || "") }]))'
          profiles:
            type: javascript
            expr: flow_input.closure?.profiles
          shares:
            type: javascript
            expr: flow_input.guest?.shares
          ssh_keys:
            type: javascript
            expr: flow_input.guest?.ssh_keys
          telemetry_collectors:
            type: javascript
            expr: flow_input.closure?.telemetry_collectors
          telemetry_ebpf:
            type: javascript
            expr: flow_input.closure?.telemetry_ebpf
          telemetry_ebpf_configs:
            type: javascript
            expr: flow_input.closure?.telemetry_ebpf_configs
          telemetry_logs_url:
            type: javascript
            expr: flow_input.closure?.telemetry_logs_url
          telemetry_metrics_url:
            type: javascript
            expr: flow_input.closure?.telemetry_metrics_url
          test_suites:
            type: javascript
            expr: flow_input.closure?.test_suites
          user_name:
            type: javascript
            expr: flow_input.guest?.user_name
          vm_name:
            type: javascript
            expr: flow_input.guest?.vm_name
        path: f/nix/render_config
      timeout:
        type: static
        value: 120
    - id: lock_config
      summary: nix flake lock
      value:
        type: script
        input_transforms:
          config_dir:
            type: javascript
            expr: results.render_config.config_dir
          update:
            type: javascript
            expr: flow_input.lock?.update_lock
        path: f/nix/lock_config
      retry:
        constant:
          attempts: 2
          seconds: 5
      timeout:
        type: static
        value: 300
    - id: build_closure
      summary: nix build .#toplevel + read bootspec
      value:
        type: script
        input_transforms:
          config_dir:
            type: javascript
            expr: results.render_config.config_dir
        path: f/nix/build_closure
      retry:
        constant:
          attempts: 2
          seconds: 10
      timeout:
        type: static
        value: 3600
  same_worker: true
schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  order:
    - guest
    - closure
    - lock
  properties:
    lock:
      type: object
      description: flake.lock pinning behaviour.
      default: {}
      order:
        - update_lock
      properties:
        update_lock:
          type: boolean
          description: |-
            Re-pin the vendored nixos-flake input instead of only filling
            missing lock entries. On by default: each worker keeps its own
            per-VM config dir, and a stale lock there silently rebuilds
            yesterday's vendored flake.
          default: true
      title: Lock
    closure:
      type: object
      description: What nix builds into the toplevel closure.
      default: {}
      order:
        - profiles
        - test_suites
        - source_overrides
        - telemetry_metrics_url
        - telemetry_logs_url
        - telemetry_collectors
        - telemetry_ebpf
        - telemetry_ebpf_configs
      properties:
        source_overrides:
          type: object
          description: |-
            Rebuild a package from a ref in its project's Bare instead of its
            pinned version. Pick a branch or tag, or type one via Custom Ref;
            blank keeps the pinned version. The worker clones from the Bare,
            so publish your work there first.
          default: {}
          order:
            - xfstests
            - xfsprogs
            - fio
            - libbpf-tools
            - blktests
          properties:
            xfstests:
              type: object
              title: xfstests
              order:
                - ref
                - custom_ref
                - git_ref
              properties:
                ref:
                  type: object
                  description: |-
                    Branch or tag in the xfstests-dev Bare to build from
                    (developer branches, then mirror branches, then tags
                    newest first). Blank keeps the pinned version.
                  format: dynselect-list_xfstests_refs
                  showExpr: fields.custom_ref !== true
                  title: Ref
                custom_ref:
                  type: boolean
                  description: |-
                    Type the ref by hand (a branch, tag or full commit id)
                    instead of picking from the Bare's ref list.
                  default: false
                  title: Custom Ref
                git_ref:
                  type: string
                  description: |-
                    Branch, tag or full commit id in the xfstests-dev Bare.
                    Blank keeps the pinned version.
                  default: ''
                  showExpr: fields.custom_ref === true
            xfsprogs:
              type: object
              title: xfsprogs
              order:
                - ref
                - custom_ref
                - git_ref
              properties:
                ref:
                  type: object
                  description: |-
                    Branch or tag in the xfsprogs-dev Bare to build from
                    (developer branches, then mirror branches, then tags
                    newest first). Blank keeps the pinned version.
                  format: dynselect-list_xfsprogs_refs
                  showExpr: fields.custom_ref !== true
                  title: Ref
                custom_ref:
                  type: boolean
                  description: |-
                    Type the ref by hand (a branch, tag or full commit id)
                    instead of picking from the Bare's ref list.
                  default: false
                  title: Custom Ref
                git_ref:
                  type: string
                  description: |-
                    Branch, tag or full commit id in the xfsprogs-dev Bare.
                    Blank keeps the pinned version.
                  default: ''
                  showExpr: fields.custom_ref === true
            fio:
              type: object
              title: fio
              order:
                - ref
                - custom_ref
                - git_ref
              properties:
                ref:
                  type: object
                  description: |-
                    Branch or tag in the fio Bare to build from (developer
                    branches, then mirror branches, then tags newest first).
                    Blank keeps the pinned version.
                  format: dynselect-list_fio_refs
                  showExpr: fields.custom_ref !== true
                  title: Ref
                custom_ref:
                  type: boolean
                  description: |-
                    Type the ref by hand (a branch, tag or full commit id)
                    instead of picking from the Bare's ref list.
                  default: false
                  title: Custom Ref
                git_ref:
                  type: string
                  description: |-
                    Branch, tag or full commit id in the fio Bare. Blank
                    keeps the pinned version.
                  default: ''
                  showExpr: fields.custom_ref === true
            libbpf-tools:
              type: object
              title: libbpf-tools
              order:
                - ref
                - custom_ref
                - git_ref
              properties:
                ref:
                  type: object
                  description: |-
                    Branch or tag in the bcc Bare to build from (developer
                    branches, then mirror branches, then tags newest first).
                    Blank keeps the pinned version.
                  format: dynselect-list_libbpf_tools_refs
                  showExpr: fields.custom_ref !== true
                  title: Ref
                custom_ref:
                  type: boolean
                  description: |-
                    Type the ref by hand (a branch, tag or full commit id)
                    instead of picking from the Bare's ref list.
                  default: false
                  title: Custom Ref
                git_ref:
                  type: string
                  description: |-
                    Branch, tag or full commit id in the bcc Bare. Blank
                    keeps the pinned version.
                  default: ''
                  showExpr: fields.custom_ref === true
            blktests:
              type: object
              title: blktests
              order:
                - ref
                - custom_ref
                - git_ref
              properties:
                ref:
                  type: object
                  description: |-
                    Branch or tag in the blktests Bare to build from
                    (developer branches, then mirror branches, then tags
                    newest first). Blank keeps the pinned version.
                  format: dynselect-list_blktests_refs
                  showExpr: fields.custom_ref !== true
                  title: Ref
                custom_ref:
                  type: boolean
                  description: |-
                    Type the ref by hand (a branch, tag or full commit id)
                    instead of picking from the Bare's ref list.
                  default: false
                  title: Custom Ref
                git_ref:
                  type: string
                  description: |-
                    Branch, tag or full commit id in the blktests Bare.
                    Blank keeps the pinned version.
                  default: ''
                  showExpr: fields.custom_ref === true
        profiles:
          type: array
          description: |-
            nixos-flake profile modules to import (fully featured by default;
            pare back for a lighter closure). controller is a host role and off
            by default. telemetry is off by default; it pushes metrics and the
            journal to the monitoring stack.
          default:
            - devel
            - build-tools
            - monitoring
          items:
            type: string
            enum:
              - build-tools
              - controller
              - devel
              - monitoring
              - telemetry
        telemetry_collectors:
          type: array
          description: |-
            node_exporter collectors the telemetry profile enables on top of its
            defaults; all five are disabled in node_exporter by default.
            buddyinfo exposes the buddy allocator's per-order free block counts,
            zoneinfo the per-zone counters, and meminfo_numa the per-NUMA-node
            meminfo. That profile is off by default.
          default: []
          items:
            type: string
            enum:
              - buddyinfo
              - zoneinfo
              - meminfo_numa
              - processes
              - interrupts
          title: Extra collectors
        telemetry_ebpf:
          type: boolean
          description: |-
            Run ebpf_exporter on the guest and stream its metrics through the
            same push pipeline. The kernel must expose BTF
            (/sys/kernel/btf/vmlinux). Applies only with the telemetry profile,
            which is off by default.
          default: false
          title: eBPF exporter
        telemetry_ebpf_configs:
          type: array
          description: |-
            ebpf_exporter example configs to load when the eBPF exporter is
            on. biolatency exports block I/O latency histograms; bio-trace
            per-request traces. Applies only with the telemetry profile, which
            is off by default.
          default:
            - biolatency
          items:
            type: string
            enum:
              - biolatency
              - bio-trace
          title: eBPF configs
        telemetry_logs_url:
          type: string
          description: |-
            Loki push API endpoint the telemetry profile ships the journal to.
            The default reaches the guest's own host over the QEMU user network.
            That profile is off by default, and ships only if a monitoring stack
            is listening at the endpoint.
          default: http://10.0.2.2:3100/loki/api/v1/push
          title: Logs push URL
        telemetry_metrics_url:
          type: string
          description: |-
            Prometheus remote_write endpoint the telemetry profile pushes
            metrics to. The default reaches the guest's own host over the QEMU
            user network. That profile is off by default, and pushes only if a
            monitoring stack is listening at the endpoint.
          default: http://10.0.2.2:9090/api/v1/write
          title: Metrics push URL
        test_suites:
          type: array
          description: |-
            nixos-flake testSuite modules to import (all by default; pare back
            for a lighter closure).
          default:
            - blktests
            - fstests
            - gitr
            - kunit
            - ltp
            - mmtests
            - pynfs
            - selftests
            - sysbench
            - usertests
          items:
            type: string
            enum:
              - blktests
              - fstests
              - gitr
              - kunit
              - ltp
              - mmtests
              - pynfs
              - selftests
              - sysbench
              - usertests
      title: Closure
    guest:
      type: object
      description: Guest identity, access, and virtiofs mounts.
      default: {}
      order:
        - vm_name
        - user_name
        - ssh_keys
        - shares
        - home
        - home_dir
      properties:
        home:
          type: boolean
          description: |-
            Land in your home: mount the operator's host home at `/home/<you>`
            AND make it root's home, so `ssh <vm>` drops you straight into your
            files (writable: root maps to your host uid via virtiofsd). One
            toggle wires the closure mount, root's home, and the host serving.
          default: true
        home_dir:
          type: string
          description: |-
            Advanced: override the guest mount point + root's home (else
            `/home/<host operator>`, auto-discovered). The served *content* is
            always the operator's host home; an override only relocates where it
            appears in the guest.
          default: ''
          title: Home Dir
        shares:
          type: object
          description: |-
            virtiofs shares keyed by guest mount point, e.g. {"/mnt/home":
            {"tag": "home", "options": ["ro"]}}. The `fstests` mount is
            auto-added when Test Suites include `fstests`; `home` adds the
            operator's home. Both coexist.
          default: {}
        ssh_keys:
          type: array
          description: |-
            Authorized SSH keys for the root and unprivileged accounts.
          default: []
          items:
            type: string
          title: SSH Keys
        user_name:
          type: string
          description: |-
            Unprivileged account name in the guest (nixos-flake.user.name).
          default: kdevops
        vm_name:
          type: string
          description: Guest hostname and per-VM config directory name.
          default: nixos
          title: VM Name
      required:
        - vm_name
      title: Guest
  required: []
  x-windmill-dyn-select-code: >
    def _project_refs(project: str, filterText: str) -> list:
        # The Bare's branches + tags via f.common.gitrefs (the one ref source).
        try:
            from f.common.gitrefs import list_refs
            return list_refs(project, filterText)
        except Exception:
            return []

    def list_xfstests_refs(filterText: str = "", **_: object) -> list:
        return _project_refs("xfstests-dev", filterText)

    def list_xfsprogs_refs(filterText: str = "", **_: object) -> list:
        return _project_refs("xfsprogs-dev", filterText)

    def list_fio_refs(filterText: str = "", **_: object) -> list:
        return _project_refs("fio", filterText)

    def list_libbpf_tools_refs(filterText: str = "", **_: object) -> list:
        return _project_refs("bcc", filterText)

    def list_blktests_refs(filterText: str = "", **_: object) -> list:
        return _project_refs("blktests", filterText)
  x-windmill-dyn-select-lang: python3
