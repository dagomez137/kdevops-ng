summary: Compile the kernel
description: |-
  Build one or more make targets (default: the default goal) for an
  already-configured worktree inside the `nixos-flake#build` devShell, with
  `make --jobs=$(nproc)` so the container cgroup governs CPU and concurrent
  builds self-balance.

  Reads `worktree`/`build_dir` from `prepare_worktree` and expects a `.config`
  from a configure step. Returns `image` (the `arch/x86/boot/bzImage` path,
  x86 only and null elsewhere) plus the build provenance the kernel bakes into
  its generated headers: `uts_release`, `linux_compiler`, `uts_machine`,
  `linux_compile_by`, `linux_compile_host` and `uts_version`.
lock: '!inline f/kernel/compile.script.lock'
kind: script
schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  order:
    - worktree
    - build_dir
    - targets
    - make_flags
  properties:
    build_dir:
      type: string
      description: |-
        Out-of-tree build directory, passed as make O= (from prepare_worktree).
    make_flags:
      type: string
      description: |-
        Extra make variables/flags, space-separated, appended verbatim.
      default: ''
    targets:
      type: string
      description: Space-separated make targets to build.
      default: bzImage
    worktree:
      type: string
      description: Kernel source worktree (from prepare_worktree).
  required:
    - worktree
    - build_dir
