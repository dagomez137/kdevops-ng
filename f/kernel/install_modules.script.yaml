summary: Install the kernel modules into a destdir
description: |-
  Install the built kernel modules into a separate `destdir` under
  `lib/modules/<release>`, inside the `nixos-flake#build` devShell. `destdir`
  defaults to a sibling of the build dir (`<slot>/destdir`) and the host
  `/lib/modules` is never touched.

  Skip it for an all-built-in kernel (CONFIG_MODULES=n): there is nothing to
  install. The modules were already built by the default `make`, so this does
  not rebuild them. Returns `destdir` and `modules`.
lock: '!inline f/kernel/install_modules.script.lock'
kind: script
schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  order:
    - worktree
    - build_dir
    - destdir
    - make_flags
    - source_symlink
  properties:
    build_dir:
      type: string
      description: |-
        Out-of-tree build directory, passed as make O= (from prepare_worktree).
    destdir:
      type: string
      description: |-
        Install root (`INSTALL_MOD_PATH=<destdir>`). Empty = `<slot>/destdir`.
      default: ''
    make_flags:
      type: string
      description: |-
        Extra make variables/flags, space-separated, appended verbatim.
      default: ''
    source_symlink:
      type: boolean
      description: |-
        Add the canonical /lib/modules/<release>/source symlink (-> worktree)
        after modules_install.
      default: true
    worktree:
      type: string
      description: Kernel source worktree (from prepare_worktree).
  required:
    - worktree
    - build_dir
