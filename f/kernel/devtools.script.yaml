summary: Generate kernel dev-tooling artifacts
description: |-
  Generate the developer-tooling artifacts an out-of-tree build leaves in the
  build dir, or not at all, where IDEs and debuggers look for them. Each is
  independently toggled and on by default: the clangd C index
  (`compile_commands.json`), the kernel GDB helpers (`vmlinux-gdb.py` and
  `lx-*`), and the rust-analyzer index (`rust-project.json`, auto-skipped
  unless the build is `CONFIG_RUST=y`).

  Runs after `compile`. Returns the artifact paths, null for any skipped.
lock: '!inline f/kernel/devtools.script.lock'
kind: script
schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  order:
    - worktree
    - build_dir
    - compile_commands
    - scripts_gdb
    - rust_analyzer
    - make_flags
  properties:
    build_dir:
      type: string
      description: |-
        Out-of-tree build directory, passed as make O= (from prepare_worktree).
    compile_commands:
      type: boolean
      description: |-
        Generate `compile_commands.json` (clangd/IDE C index) in the source
        tree.
      default: true
    make_flags:
      type: string
      description: |-
        Extra make variables/flags, space-separated, appended verbatim.
      default: ''
    rust_analyzer:
      type: boolean
      description: |-
        Generate `rust-project.json` (rust-analyzer) when `CONFIG_RUST=y`.
      default: true
    scripts_gdb:
      type: boolean
      description: |-
        Build kernel GDB helpers (`vmlinux-gdb.py` + `lx-*`) into the build dir.
      default: true
      title: Scripts GDB
    worktree:
      type: string
      description: Kernel source worktree (from prepare_worktree).
  required:
    - worktree
    - build_dir
