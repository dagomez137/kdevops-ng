summary: Publish a devel layer to the Nix store
description: |-
  Add the build dir's developer subset to the Nix store under
  `kernel-devel-<release>`, indexed as a GC root, so a developer's
  `fetch_devel` resolves this store path to index a worktree and build modules
  against it. The subset is an allowlist, so no compiled output can leak in and
  the store path is already lean.

  Run only after a real build; the flow skips it on reuse. Returns the index
  `name`, the resolved `store_path` and the `uts_release`.
lock: '!inline f/kernel/publish_devel.script.lock'
kind: script
schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  order:
    - build_dir
    - uts_release
  properties:
    build_dir:
      type: string
      description: The kernel build dir whose developer subset to publish.
    uts_release:
      type: string
      description: |-
        The build identity (baked kernelrelease) to key the devel layer by.
  required:
    - build_dir
    - uts_release
