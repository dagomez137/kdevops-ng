summary: Build and install the kernel selftests
description: |-
  `make kselftest-install` the selected selftest collections into a
  self-contained `<destdir>/kselftest_install` tree (`run_kselftest.sh`, the
  `kselftest-list.txt` catalog, one directory per collection), inside the
  `nixos-flake#build-kselftests` devShell. `TARGETS` selects the collections
  (curated default set; `extra_targets` appends free-form ones) and
  `FORCE_TARGETS=1` turns a failed collection into a hard error instead of a
  silent drop from the install.

  Skips the build when the reuse gate says `kselftests-<uts_release>` is already
  published to the Nix store. Reads `worktree`/`build_dir` from
  `prepare_worktree`; returns `install_dir`, the effective `targets`, the
  `tests` count and the installed `version`.
lock: '!inline f/kernel/build_selftests.script.lock'
kind: script
schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  order:
    - worktree
    - build_dir
    - destdir
    - targets
    - extra_targets
    - reuse_present
    - uts_release
  properties:
    build_dir:
      type: string
      description: |-
        Out-of-tree build directory, passed as make O= (from prepare_worktree).
    destdir:
      type: string
      description: |-
        Install root; the tree lands at `<destdir>/kselftest_install`. Empty =
        `<slot>/destdir`.
      default: ''
    extra_targets:
      type: string
      description: |-
        Extra selftest collections, space-separated, appended to `targets`.
      default: ''
    reuse_present:
      type: boolean
      description: |-
        Skip the build when `kselftests-<uts_release>` is already in the Nix
        store index (the build flow's reuse gate).
      default: false
    targets:
      type: array
      description: |-
        Selftest collections to build (make `TARGETS`). Empty = the curated
        default set.
      default: []
      items:
        type: string
    uts_release:
      type: string
      description: |-
        The build identity (baked kernelrelease); names the published artifact
        `kselftests-<uts_release>` for the reuse check.
      default: ''
    worktree:
      type: string
      description: Kernel source worktree (from prepare_worktree).
  required:
    - worktree
    - build_dir
