summary: Install the kernel image into a destdir
description: |-
  Install the built kernel image and System.map into a separate `destdir`,
  inside the `nixos-flake#build` devShell, named by release. `destdir` defaults
  to a sibling of the build dir (`<slot>/destdir`) and the host `/boot` is never
  touched.

  Modules are a separate, independently-skippable step
  (`f/kernel/install_modules`); an all-built-in kernel needs only this one.
  Reads `worktree`/`build_dir` from `prepare_worktree`; returns `destdir` and
  `boot`.
lock: '!inline f/kernel/install.script.lock'
kind: script
schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  order:
    - worktree
    - build_dir
    - destdir
    - make_flags
  properties:
    build_dir:
      type: string
      description: |-
        Out-of-tree build directory, passed as make O= (from prepare_worktree).
    destdir:
      type: string
      description: |-
        Install root (`INSTALL_PATH=<destdir>/boot`). Empty = `<slot>/destdir`.
      default: ''
    make_flags:
      type: string
      description: |-
        Extra make variables/flags, space-separated, appended verbatim.
      default: ''
    worktree:
      type: string
      description: Kernel source worktree (from prepare_worktree).
  required:
    - worktree
    - build_dir
