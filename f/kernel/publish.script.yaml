summary: Publish a run layer to the Nix store
description: |-
  Add this release's run layer to the Nix store under `kernel-<release>`,
  indexed as a GC root, so a peer can fetch it by release with `nix copy`. Run
  only after a real install; the flow skips it on reuse.

  Returns the index `name`, the resolved `store_path`, the `uts_release`, and
  the run layer resolved inside the store (`bzImage`, `boot`, `modules`), so
  the manifest can point a cross-worker-group boot at `/nix/store`.
lock: '!inline f/kernel/publish.script.lock'
kind: script
schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  order:
    - destdir
    - uts_release
  properties:
    destdir:
      type: string
      description: Install root holding the run layer (the slot `destdir`).
    uts_release:
      type: string
      description: |-
        The build identity (baked kernelrelease) whose run layer to publish.
  required:
    - destdir
    - uts_release
