summary: Bisect a kernel regression
description: |-
  Find the first bad kernel commit by driving `git bisect` with real runs: each
  iteration builds the candidate commit, boots a dedicated guest with it
  (`f/qsu/bringup`, kernel artifacts reused from the Nix store when the commit
  was built before), runs the selected payload, and feeds the verdict back.

  Before bisecting it tests the endpoints standalone. A bad ref that passes
  alone ends the run as `not_reproducible_standalone`, meaning the failure needs
  something else to run first, which is itself the finding; a failing good ref
  ends it as `good_endpoint_failed`, so pick an older one. A kernel that fails
  to build or boot is `git bisect skip`ped, so this flow bisects payload
  verdicts, not boot failures.

  The state (a `--shared` clone of the Bare plus `state.json`) lives under
  `$SYSTEM_DIR/bisect/<vm_name>/` and survives the run, so a manual `git
  bisect` can resume from it. Pick the payload and its knobs below; each field
  says what it decides.
value:
  modules:
    - id: iterate
      summary: Decide, build + boot, run KUnit, repeat
      value:
        type: whileloopflow
        skip_failures: true
        squash: false
        modules:
          - id: step
            summary: Advance the bisect state machine (f/kernel/bisect_step)
            value:
              type: script
              input_transforms:
                vm_name:
                  type: javascript
                  expr: flow_input.vm_name
                good:
                  type: javascript
                  expr: flow_input.good
                bad:
                  type: javascript
                  expr: flow_input.bad
                suites:
                  type: javascript
                  expr: flow_input.suites
                max_steps:
                  type: javascript
                  expr: flow_input.max_steps
                payload:
                  type: javascript
                  expr: flow_input.payload ?? "kunit"
                error_re:
                  type: javascript
                  expr: flow_input.error_re ?? ""
                max_runtime:
                  type: javascript
                  expr: flow_input.max_runtime ?? 0
                compiler:
                  type: javascript
                  expr: flow_input.compiler ?? "gcc"
                make_flags:
                  type: javascript
                  expr: flow_input.make_flags ?? ""
                guest:
                  type: javascript
                  expr: flow_input.guest ?? {}
              path: f/kernel/bisect_step
              tag_override: vm
            stop_after_if:
              expr: result.done === true
              skip_if_stopped: false
          - id: check
            summary: Build-check the harnesses at the candidate (f/kernel/check_usertests)
            value:
              type: script
              input_transforms:
                vm_name:
                  type: javascript
                  expr: flow_input.vm_name
                candidate:
                  type: javascript
                  expr: results.step.candidate
                harnesses:
                  type: javascript
                  expr: flow_input.suites
                error_re:
                  type: javascript
                  expr: flow_input.error_re ?? ""
              path: f/kernel/check_usertests
              tag_override: vm
            skip_if:
              expr: flow_input.payload !== 'usertests_build'
            timeout:
              type: static
              value: 1800
          - id: bringup
            summary: Build the candidate kernel + boot the bisect guest (f/qsu/bringup)
            value:
              type: flow
              input_transforms:
                kernel:
                  type: javascript
                  expr: results.step.bringup.kernel
                closure:
                  type: javascript
                  expr: results.step.bringup.closure
                qemu:
                  type: javascript
                  expr: results.step.bringup.qemu
                worktree:
                  type: javascript
                  expr: results.step.bringup.worktree ?? {}
                boot_qemu:
                  type: javascript
                  expr: results.step.bringup.boot_qemu
                boot_kernel:
                  type: javascript
                  expr: results.step.bringup.boot_kernel
                boot_networking:
                  type: javascript
                  expr: results.step.bringup.boot_networking
                boot_sharing:
                  type: javascript
                  expr: results.step.bringup.boot_sharing
                boot_nvme:
                  type: javascript
                  expr: results.step.bringup.boot_nvme
                boot_orchestration:
                  type: javascript
                  expr: results.step.bringup.boot_orchestration
                boot_passthrough:
                  type: javascript
                  expr: results.step.bringup.boot_passthrough
                vm:
                  type: javascript
                  expr: results.step.bringup.vm
              path: f/qsu/bringup
            skip_if:
              expr: flow_input.payload === 'usertests_build'
          - id: settle
            summary: Wait for the guest to finish starting up (f/qsu/settle)
            value:
              type: script
              input_transforms:
                vm_name:
                  type: javascript
                  expr: flow_input.vm_name
                timeout:
                  type: static
                  value: 240
              path: f/qsu/settle
              tag_override: vm
            skip_if:
              expr: flow_input.payload === 'usertests_build'
          - id: run
            summary: Run the selected suites on the candidate (f/kunit/run)
            value:
              type: flow
              input_transforms:
                vm_name:
                  type: javascript
                  expr: flow_input.vm_name
                suites:
                  type: javascript
                  expr: flow_input.suites
                service:
                  type: javascript
                  expr: '({timeout: flow_input.service?.timeout ?? 600,
                    poll_interval: 5, stream_logs: true})'
              path: f/kunit/run
            skip_if:
              expr: (flow_input.payload ?? 'kunit') !== 'kunit'
          - id: run_selftests
            summary: Run the selected collections on the candidate (f/selftests/run)
            value:
              type: flow
              input_transforms:
                vm_name:
                  type: javascript
                  expr: flow_input.vm_name
                collections:
                  type: javascript
                  expr: flow_input.suites
                tests:
                  type: javascript
                  expr: '[]'
                repeats:
                  type: javascript
                  expr: flow_input.service?.repeats ?? 1
                override_timeout:
                  type: javascript
                  expr: flow_input.service?.override_timeout ?? 0
                fail_on_user_crash:
                  type: javascript
                  expr: flow_input.service?.fail_on_user_crash ?? false
                service:
                  type: javascript
                  expr: '({timeout: flow_input.service?.timeout ?? 600,
                    poll_interval: 15, stream_logs: false})'
              path: f/selftests/run
            skip_if:
              expr: flow_input.payload !== 'selftests'
          - id: run_runtime_tests
            summary: Run the selected test modules on the candidate (f/runtime_tests/run)
            value:
              type: flow
              input_transforms:
                vm_name:
                  type: javascript
                  expr: flow_input.vm_name
                modules:
                  type: javascript
                  expr: flow_input.suites
                repeats:
                  type: javascript
                  expr: flow_input.service?.repeats ?? 1
                service:
                  type: javascript
                  expr: '({timeout: flow_input.service?.timeout ?? 600,
                    poll_interval: 10, stream_logs: false})'
              path: f/runtime_tests/run
            skip_if:
              expr: flow_input.payload !== 'runtime_tests'
          - id: run_usertests
            summary: Run the selected harnesses on the candidate (f/usertests/run)
            value:
              type: flow
              input_transforms:
                vm_name:
                  type: javascript
                  expr: flow_input.vm_name
                harnesses:
                  type: javascript
                  expr: flow_input.suites
                repeats:
                  type: javascript
                  expr: flow_input.service?.repeats ?? 1
                seed:
                  type: static
                  value: 0
                long_run:
                  type: static
                  value: false
                service:
                  type: javascript
                  expr: '({timeout: flow_input.service?.timeout ?? 1200,
                    poll_interval: 10, stream_logs: false})'
              path: f/usertests/run
            skip_if:
              expr: flow_input.payload !== 'usertests'
    - id: report
      summary: Render the bisect run (f/kernel/bisect_report)
      value:
        type: script
        input_transforms:
          vm_name:
            type: javascript
            expr: flow_input.vm_name
        path: f/kernel/bisect_report
        tag_override: vm
    - id: judge
      summary: Fail unless the bisect concluded (f/kernel/bisect_judge)
      value:
        type: script
        input_transforms:
          vm_name:
            type: javascript
            expr: flow_input.vm_name
        path: f/kernel/bisect_judge
        tag_override: vm
  failure_module:
    id: stop
    summary: Stop any running KUnit units on the bisect guest (f/kunit/stop)
    value:
      type: script
      input_transforms:
        suites:
          type: javascript
          expr: flow_input.suites ?? []
        vm_name:
          type: javascript
          expr: flow_input.vm_name
      path: f/kunit/stop
      tag_override: vm
    skip_if:
      expr: (flow_input.payload ?? 'kunit') !== 'kunit'
schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  order:
    - bad
    - good
    - payload
    - suites
    - error_re
    - max_runtime
    - compiler
    - make_flags
    - vm_name
    - max_steps
    - service
    - guest
  properties:
    payload:
      type: string
      description: |-
        What decides a candidate's verdict. All but the last build and
        boot the candidate on the bisect guest: `kunit` runs the selected
        KUnit suites; `selftests` runs kselftest collections built from
        the candidate's own tree; `runtime_tests` loads module-init test
        modules (`test_xarray`, `test_maple_tree`, ...) and judges their
        kmsg summaries; `usertests` runs the userspace harness binaries
        (`radix-tree/xarray`, `radix-tree/maple`, ...) built from the
        candidate's own `lib/` sources under sanitizers. Any of them
        pairs with Max Runtime to hunt a runtime regression.
        `usertests_build` never touches a guest and only asks whether the
        selected `tools/testing` harnesses compile at the candidate
        (seconds per iteration).
      default: kunit
      enum:
        - kunit
        - usertests_build
        - selftests
        - runtime_tests
        - usertests
      title: Payload
    error_re:
      type: string
      description: |-
        [payload=usertests_build] Regex a failed build's output must match
        to count as `bad`; a failure without it counts as `good` (the hunt
        tracks when the signature appeared, not build health). Empty = any
        build failure is `bad`.
      default: ''
      title: Error Regex
    max_runtime:
      type: number
      description: |-
        Seconds the run's summed item runtime may take before a passing
        candidate still counts as `bad` (any guest payload whose report
        records per-item times). Pick a value between the fast and slow
        endpoints' runtimes to bisect a runtime regression. 0 = verdict
        is pass/fail only.
      default: 0
      title: Max Runtime
    compiler:
      type: string
      description: |-
        Compiler for the candidate builds. Pick the one the endpoints were
        measured with so their published kernels are reused and every
        candidate is toolchain-comparable; note the devShell's GCC breaks
        release tags before the upstream C23 fixes, where clang builds the
        whole range.
      default: gcc
      enum:
        - gcc
        - clang
      title: Compiler
    make_flags:
      type: string
      description: |-
        Extra make variables/flags for the candidate builds, appended
        verbatim; old ranges often need vintage dodges (e.g.
        "KCFLAGS=-Wno-enum-enum-conversion RUSTC=rustc-unavailable" for
        trees whose Rust support predates the modern toolchain).
      default: ''
      title: Make Flags
    bad:
      type: object
      description: |-
        Ref where the suites fail (the bisect's bad endpoint), from the
        Bare's live ref list. Tested standalone first: if it passes alone,
        the run concludes `not_reproducible_standalone` without bisecting.
      format: dynselect-list_kernel_refs
      title: Bad Ref
    good:
      type: object
      description: |-
        Ref where the suites pass (the bisect's good endpoint), from the
        Bare's live ref list. Verified before the bisect starts.
      format: dynselect-list_kernel_refs
      title: Good Ref
    suites:
      type: object
      description: |-
        What the payload runs, named in its own vocabulary: KUnit suites,
        kselftest collections, runtime-test modules (`test_xarray`),
        usertests harness binaries (`radix-tree/maple`), or, for the
        build payload, harness directories. Every listed one must pass
        for a candidate to count as good; pick the failing one alone for
        the sharpest signal.
      default: []
      format: dynmultiselect-list_suites
      title: Suites
    vm_name:
      type: string
      description: |-
        Dedicated bisect guest, replaced on every iteration; keep it away
        from developer guests. Also keys the on-disk bisect state, which is
        all the build payload uses it for (no guest is touched).
      default: bisect
      title: VM Name
    max_steps:
      type: integer
      description: |-
        Bisect verdicts to feed before giving up red (`max_steps_exceeded`).
        A few hundred commits need about eight; skips add more.
      default: 20
      title: Max Steps
    service:
      type: object
      description: |-
        Suite-run tuning passed through to the KUnit or selftests run.
      default: {}
      order:
        - timeout
        - override_timeout
        - repeats
        - fail_on_user_crash
      properties:
        timeout:
          type: integer
          description: |-
            Seconds to poll each suite's unit to a terminal state per
            iteration.
          default: 600
          title: Suite Timeout
        override_timeout:
          type: integer
          description: |-
            [payload=selftests] The kselftest runner's per-test timeout
            override; 0 keeps each collection's own `settings` default
            (45 seconds when it ships none, which kills `kmod`; give it
            600 or more).
          default: 0
          title: Per-test Timeout
        repeats:
          type: integer
          description: |-
            [payload=runtime_tests|usertests|selftests] Statistical repeats
            per candidate: the suite runs each item this many times and its
            report's median runtime is what `max_runtime` judges, so a
            runtime hunt is not at the mercy of one noisy boot. Repeats also
            catch an intermittent failure: any failing run fails the
            candidate.
          default: 1
          title: Repeats
        fail_on_user_crash:
          type: boolean
          description: |-
            [payload=selftests] Turn a userspace crash during the run (such as
            a segfaulting usermode-helper `modprobe`) into a bad verdict, even
            when the KTAP passes.
          default: false
          title: Fail On Userspace Crash
      title: Service
    guest:
      type: object
      description: |-
        Advanced override: paste the inputs of the `f/qsu/bringup` run whose
        guest reproduces the failure (the run's input JSON, as the Windmill
        run page shows it) and every candidate's guest is booted with
        exactly those inputs. The bisect still sets the VM to VM Name, the
        kernel ref to the candidate (dropping a pasted ref or b4 series),
        Compiler and Make Flags, store reuse, and adds the picked suites and
        the payload's closure test suite to the pasted lists. Empty keeps
        the bisect's built-in guest.
      default: {}
      title: Guest Override
  required:
    - bad
    - good
    - suites
  x-windmill-dyn-select-code: >
    def list_kernel_refs(filterText: str = "", **_: object) -> list:
        # The Bare's branches + tags via f.common.gitrefs (the one ref source).
        try:
            from f.common.gitrefs import list_refs
            return list_refs("linux", filterText)
        except Exception:
            return []


    def list_suites(
        vm_name: str = "", payload: str = "", filterText: str = "", **_: object
    ) -> list:
        # Each payload's own picker: the guest's KUnit suites from the per-VM
        # cache f/kunit/discover writes (union fallback), the kselftest
        # collections, the runtime-test module catalog, the usertests harness
        # binaries, or the build payload's harness directory catalog.
        try:
            if payload == "usertests_build":
                from f.kernel.build_usertests import CATALOG
                needle = (filterText or "").lower()
                return [h for h in CATALOG if needle in h]
            if payload == "selftests":
                from f.selftests.common import list_collections
                return list_collections(vm_name, filterText)
            if payload == "runtime_tests":
                from f.runtime_tests.common import list_modules
                return list_modules(vm_name, filterText)
            if payload == "usertests":
                from f.usertests.common import list_harnesses
                return list_harnesses(vm_name, filterText)
            from f.kunit.common import list_suites as _list_suites
            return _list_suites(vm_name, filterText)
        except Exception:
            return []
  x-windmill-dyn-select-lang: python3
