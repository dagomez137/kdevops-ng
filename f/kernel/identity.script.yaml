summary: Bake a build identity into kernelrelease
description: |-
  Library module imported by the configure steps (`from f.kernel.identity
  import bake_identity`), not a runnable step. Hashes the inputs that fix a
  build's bytes and appends the digest to `CONFIG_LOCALVERSION`, so `make
  kernelrelease` and the booted `uname -r` report a unique
  `7.1.0-<label>-<hash>`. The module docstring states which inputs are in the
  hash and which are deliberately out of it.
lock: '!inline f/kernel/identity.script.lock'
kind: script
schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  order: []
  properties: {}
  required: []
