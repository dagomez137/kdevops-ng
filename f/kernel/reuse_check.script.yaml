summary: Reuse if already built
description: |-
  Probe for the artifacts this build identity would produce, first in the
  destdir and then in the Nix store, and report whether the expensive compile
  can be skipped. Run before it.

  Returns `present` and `devel_present` (the run and devel layers are
  independent store paths, so one says nothing about the other) plus the
  resolved `bzImage`/`boot`/`modules` and `destdir`, which the manifest falls
  back to when the build steps are skipped. Wipe the destdir, or set `reuse`
  off, to force a rebuild.

  With `nvidia`, an identity counts as present only when it already holds
  the NVIDIA open GPU modules at the closure's driver release, and one about
  to be rebuilt for them is refused here, before the compile, when
  `make_flags` or the `.config` in `build_dir` cannot carry them.
lock: '!inline f/kernel/reuse_check.script.lock'
kind: script
schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  order:
    - destdir
    - uts_release
    - nvidia
    - build_dir
    - make_flags
  properties:
    build_dir:
      type: string
      description: |-
        Out-of-tree kernel build directory holding the configured `.config`
        (from prepare_worktree); checked only with `nvidia`.
      default: ''
    destdir:
      type: string
      description: Install root to probe (the slot `destdir`).
    make_flags:
      type: string
      description: |-
        The kernel build's make flags (from build_flags); checked only with
        `nvidia`, for a GCC toolchain.
      default: ''
    uts_release:
      type: string
      description: The build identity (baked kernelrelease) to look for.
    nvidia:
      type: boolean
      description: |-
        Require the NVIDIA open GPU modules at the closure's driver release.
      default: false
      title: NVIDIA
  required:
    - destdir
    - uts_release
