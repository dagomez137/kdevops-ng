summary: Reuse if already built
description: |-
  Probe for the artifacts this build identity would produce, first in the
  destdir and then in the Nix store, and report whether the expensive compile
  can be skipped. Run before it.

  Returns `present` and `devel_present` (the run and devel layers are
  independent store paths, so one says nothing about the other) plus the
  resolved `bzImage`/`boot`/`modules` and `destdir`, which the manifest falls
  back to when the build steps are skipped. Wipe the destdir, or set `reuse`
  off, to force a rebuild.
lock: '!inline f/kernel/reuse_check.script.lock'
kind: script
schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  order:
    - destdir
    - uts_release
  properties:
    destdir:
      type: string
      description: Install root to probe (the slot `destdir`).
    uts_release:
      type: string
      description: The build identity (baked kernelrelease) to look for.
  required:
    - destdir
    - uts_release
