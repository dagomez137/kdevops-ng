summary: Build-check the usertests harnesses at a commit
description: |-
  The host-side payload of `f/kernel/bisect`'s `usertests_build` mode: no
  guest, no boot, just whether the selected `tools/testing` harnesses compile
  at the candidate commit. Writes the verdict to `report.json` beside
  `state.json`, where `f/kernel/bisect_step` reads it.

  Without `error_re` the verdict is build health. With it the verdict tracks
  that signature instead, so a failure without it is `passed` and an older,
  unrelated break in the range cannot derail the hunt.
lock: '!inline f/kernel/check_usertests.script.lock'
kind: script
schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  order:
    - vm_name
    - candidate
    - harnesses
    - error_re
  properties:
    candidate:
      type: string
      description: |-
        Commit to build-check (from `bisect_step`'s `candidate`).
    error_re:
      type: string
      description: |-
        Regex a failed build's output must match to count as `failed`; a
        failure without it counts as `passed` (the hunt tracks the
        signature, not build health). Empty = any failure is `failed`.
      default: ''
      title: Error Regex
    harnesses:
      type: array
      description: |-
        Harness directories under `tools/testing` to build. Empty = all of
        them.
      default: []
      items:
        type: string
        enum:
          - radix-tree
          - vma
          - memblock
          - scatterlist
    vm_name:
      type: string
      description: |-
        The bisect state key (the flow's VM Name input); no guest is
        touched.
      title: VM Name
  required:
    - vm_name
    - candidate
