summary: Fail the bisect unless it concluded
description: |-
  Raise unless the bisect ended with a real answer, so a run that stopped
  without one is a red Windmill job. Mirrors the suite flows' report/judge
  split.
lock: '!inline f/kernel/bisect_judge.script.lock'
kind: script
schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  order:
    - vm_name
  properties:
    vm_name:
      type: string
      description: |-
        Bisect guest whose state dir carries the outcome.
      title: VM Name
  required:
    - vm_name
tag: vm
