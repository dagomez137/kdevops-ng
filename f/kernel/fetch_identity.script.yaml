summary: Fetch a run layer from a peer
description: |-
  Pull a build identity's run layer from a registered peer into the local Nix
  store, before the expensive compile, so the following `reuse_check` reports
  `present` and the build is skipped.

  `use_peers` off, or no registered peer carrying the identity, is a no-op and
  the build proceeds locally. Returns `fetched` plus the resolved
  `uts_release`/`destdir`.
lock: '!inline f/kernel/fetch_identity.script.lock'
kind: script
schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  order:
    - destdir
    - uts_release
    - use_peers
    - devel
  properties:
    devel:
      type: boolean
      description: |-
        Also fetch this identity's devel layer (`kernel-devel-<release>`), which
        the run-layer sweep does not carry. The build flow sets it when a
        developer worktree is requested; off keeps a boot-oriented build from
        dragging the much larger layer.
      default: false
      title: Devel layer
    destdir:
      type: string
      description: Local install root to populate (the slot `destdir`).
    use_peers:
      type: boolean
      description: |-
        Sweep the registered peers (`$SYSTEM_DIR/peers`) and fetch this run
        layer from the first that published it. Off builds locally with no
        fetch.
      default: true
      title: Use Peers
    uts_release:
      type: string
      description: |-
        The build identity (baked kernelrelease) whose run layer to fetch.
  required:
    - destdir
    - uts_release
