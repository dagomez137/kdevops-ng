summary: Start a runtime-test module on a guest
description: |-
  Clear the previous instance, capture the guest journal's end-of-now cursor,
  then start `modprobe@<module>.service` over vsock-SSH with `--no-block`; the
  start job synchronizes on the module's init, which runs the whole suite.

  Returns `{vm, module, unit, cursor}`. The cursor is the run's identity: wait
  and collect read only past it, so they can never confuse this run with a
  previous one.
lock: '!inline f/runtime_tests/start.script.lock'
kind: script
schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  order:
    - vm_name
    - module
  properties:
    module:
      type: string
      description: |-
        Runtime-test module to load (a catalog name, e.g. `test_xarray`,
        `rbtree_test`); the `modprobe@` instance name, `[a-z0-9_]+` only.
      title: Module
    vm_name:
      type: object
      description: Booted VM to start the module on, over vsock-SSH.
      format: dynselect-list_vms
      title: VM Name
  required:
    - vm_name
    - module
tag: vm
