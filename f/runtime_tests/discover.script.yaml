summary: Discover a guest's runtime-tests readiness over SSH
description: |-
  Reach a booted guest over vsock-SSH and report whether it is ready to run the
  kernel's runtime test modules, and which catalog modules its booted kernel
  ships, from one read of `modules.dep`.

  Returns `{vm, host, booted, kernel_version, modules, missing}`, and writes
  the present list to the per-VM picker cache. Fails fast when the guest is not
  booted, when upstream systemd's `modprobe@.service` template is missing, or
  when the kernel ships none of the catalog. Mutates nothing on the guest.
lock: '!inline f/runtime_tests/discover.script.lock'
kind: script
schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  order:
    - vm_name
  properties:
    vm_name:
      type: object
      description: |-
        Booted VM to probe over vsock-SSH for runtime-tests readiness.
      format: dynselect-list_vms
      title: VM Name
  required:
    - vm_name
tag: vm
