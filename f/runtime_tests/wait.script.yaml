summary: Wait for a runtime-test module load to finish
description: |-
  Poll the guest's journal past start's cursor until systemd's own job-outcome
  record for the unit appears, collecting the cursor-scoped kernel ring buffer
  as it goes, since that, not the unit's output, is where the suite's results
  land. One probe of `/sys/module/<module>` after the outcome returns the
  module's post-run load state. Each poll also checks the host
  `qemu-system@<vm>.service`, so a guest a crash-on-fail module BUGs ends the
  wait instead of burning the timeout on a dead transport.

  Returns `{vm, module, unit, result, loaded, exec_status, kmsg, crashed,
  timed_out, runtime, started_realtime_ms, ended_realtime_ms}`; the
  `*_realtime_ms` pair is the run's wall-clock window in milliseconds since the
  epoch, taken from the journal records' `__REALTIME_TIMESTAMP` and null when
  the record is missing.
lock: '!inline f/runtime_tests/wait.script.lock'
kind: script
schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  order:
    - vm_name
    - module
    - unit
    - cursor
    - timeout
    - poll_interval
    - stream_logs
  properties:
    cursor:
      type: string
      description: |-
        The guest journal cursor `f/runtime_tests/start` captured before
        starting the unit; bounds every read to this run.
      title: Cursor
    module:
      type: string
      description: Runtime-test module being waited on.
      title: Module
    poll_interval:
      type: integer
      description: |-
        Seconds between journal polls (and the host liveness check).
      default: 10
      title: Poll Interval
    stream_logs:
      type: boolean
      description: |-
        Each poll, print the guest's new unit + kernel journal (merged) into the
        job log. Off = only a bounded kmsg tail at the end.
      default: true
      title: Stream Logs
    timeout:
      type: integer
      description: |-
        Maximum seconds to wait for the module load to finish before giving up
        (`timed_out`). Module init is synchronous and unbounded by the unit, so
        this deadline is the only bound on the run.
      default: 600
      title: Timeout
    unit:
      type: string
      description: |-
        The unit `f/runtime_tests/start` started (`modprobe@<module>.service`).
      title: Unit
    vm_name:
      type: object
      description: Booted VM whose module load to wait on, over vsock-SSH.
      format: dynselect-list_vms
      title: VM Name
  required:
    - vm_name
    - module
    - unit
    - cursor
tag: vm-run
