summary: Runtime-tests catalog, verdict rules and module listing
description: |-
  Library module imported by the `f/runtime_tests/*` steps (`from
  f.runtime_tests.common import CATALOG, catalog_entry, unit_for, ...`), not a
  runnable step. Curates the kernel's standalone runtime test modules and their
  upstream exit conventions, maps a module to its `modprobe@<module>.service`
  instance, lists a guest kernel's present modules from the per-VM cache, and
  holds the shared verdict rule and the atomic writer for the host cache dir.
  The module header states the executor's load-bearing quirks. Never contacts
  the guest.
lock: '!inline f/runtime_tests/common.script.lock'
kind: script
schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  order: []
  properties: {}
  required: []
