summary: Stop a runtime-tests run on a guest
description: |-
  Stop each module's `modprobe@<module>.service` instance on the guest over
  vsock-SSH, clear its latched state, and unload the module, so a stay-loaded
  one does not turn the next run into a no-op. Wired as `run.flow`'s
  `failure_module`, so cancelling a run from the Windmill UI tears the guest
  side down instead of leaving a wedged load spinning.

  Returns `{vm_name, stopped, skipped_no_transport}`. Idempotent; a guest
  unreachable from the worker is logged and skipped, never raised.
lock: '!inline f/runtime_tests/stop.script.lock'
kind: script
schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  order:
    - vm_name
    - modules
  properties:
    modules:
      type: object
      description: |-
        Runtime-test modules whose units to stop and unload. Empty = no-op.
      default: []
      format: dynmultiselect-list_modules
      title: Modules
    vm_name:
      type: object
      description: Booted VM whose runtime-test units to stop, over vsock-SSH.
      format: dynselect-list_vms
      title: VM Name
  required:
    - vm_name
tag: vm
