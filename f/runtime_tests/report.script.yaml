summary: Aggregate module results into a verdict
description: |-
  Fold the list of `f/runtime_tests/collect` results (one per module) into one
  rollup, with a `status` of `passed` only when every module passed (a failed,
  crashed, or notrun module fails the run, and so does an empty list;
  `run_status` is the one rule shared with `f/runtime_tests/judge`). Returns a
  Windmill `render_all` of three native tables (no markdown): run info
  (testsuite, kernel, guest, modules, time(s)), one row per module (module,
  tests, passed, failed, skipped, time(s), status), and one summary row per
  module across the run (failures first). When `vm_name` is given it also
  writes the structured rollup to
  `$WORKERS_DIR/shared/runtime-tests/<vm>/<kver>/report.json`. The host never
  contacts the guest.
lock: '!inline f/runtime_tests/report.script.lock'
kind: script
schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  order:
    - per_item
    - vm_name
  properties:
    per_item:
      type: array
      description: |-
        The `f/runtime_tests/collect` result objects, one per module, to
        aggregate.
      default: []
      items:
        type: object
      title: Per Item
    vm_name:
      type: string
      description: |-
        Optional: when set, also write the rollup to
        `$WORKERS_DIR/shared/runtime-tests/<vm>/<kver>/report.json`.
      default: ''
      title: VM Name
  required:
    - per_item
tag: vm
