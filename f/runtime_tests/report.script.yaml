summary: Aggregate module results into a verdict
description: |-
  Fold the per-module `f/runtime_tests/collect` results into one rollup,
  `passed` only when every module passed. Returns a Windmill `render_all` of
  three native tables: run info, one row per module, and one summary row per
  module across the run, failures first. With a `vm_name` it also writes the
  rollup to the host cache dir's `<kver>/report.json`. The host never contacts
  the guest.
lock: '!inline f/runtime_tests/report.script.lock'
kind: script
schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  order:
    - per_item
    - vm_name
  properties:
    per_item:
      type: array
      description: |-
        The `f/runtime_tests/collect` result objects, one per module, to
        aggregate.
      default: []
      items:
        type: object
      title: Per Item
    vm_name:
      type: string
      description: |-
        Optional: when set, also write the rollup to
        `$WORKERS_DIR/shared/runtime-tests/<vm>/<kver>/report.json`.
      default: ''
      title: VM Name
  required:
    - per_item
tag: vm
