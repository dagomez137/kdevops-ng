summary: Provision the Bare repos from mirrors
description: |-
  Provision the durable **Bare** main repos every build worktree is cut from,
  one per selected mirror **project**. Each Bare at
  `SYSTEM_DIR/bare/<project>.git` borrows the local **mirror**'s objects, so no
  objects are copied and no upstream network is touched, and `refs/heads/*` is
  left empty, reserved for developer pushes.

  Pick the projects from the curated **Projects** list, then set each one's
  deploy options in its own group: for `linux`, the curated **Trees** to
  integrate into the merged linux.git plus a **Source** host and **Transport**;
  for every other project, its **Source** host and **Transport**. `peers` lists
  other workbench hosts to wire as cross-host push remotes.

  Idempotent. Returns a manifest of each Bare (`bare`, `origin`, `trees`,
  `action`, `head`, `peers`).
lock: '!inline f/workbench/fetch.script.lock'
kind: script
schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  order:
    - projects
    - linux
    - qemu
    - xfstests_dev
    - xfsprogs_dev
    - fio
    - blktests
    - bcc
    - ebpf_syscall
    - systing
    - peers
    - refresh
  properties:
    projects:
      type: object
      description: |-
        Which projects to mirror, each its own bare under `MIRRORS_DIR`.
        Selecting one reveals its deploy options below.
      default:
        - linux
        - qemu
        - xfstests-dev
        - xfsprogs-dev
        - fio
        - blktests
        - bcc
        - ebpf-syscall
        - systing
      format: dynmultiselect-list_mirror_projects
      title: Projects
    linux:
      type: object
      description: How to deploy the Linux kernel mirror.
      default: {}
      order:
        - trees
        - source
        - protocol
      properties:
        trees:
          type: array
          description: |-
            Trees to integrate into the merged linux.git as remotes (torvalds is
            always the base).
          default:
            - torvalds
            - linux-next
            - linux-stable
            - modules
            - mcgrof
            - da.gomez
            - axboe
            - vfs
            - cel
            - jlayton
            - djwong
            - xfs
          items:
            type: string
            enum:
              - torvalds
              - linux-next
              - linux-stable
              - linux-stable-rc
              - modules
              - mcgrof
              - mcgrof-next
              - da.gomez
              - axboe
              - vfs
              - cel
              - jlayton
              - cxl
              - djwong
              - xfs
          title: Trees
        source:
          type: string
          description: |-
            Upstream host: kernel.org (the canonical source) or googlesource
            (the Google read-only mirror, for when kernel.org is unreachable).
          default: kernel.org
          enum:
            - kernel.org
            - googlesource
          title: Source
        protocol:
          type: string
          description: |-
            Transport to git.kernel.org: https (the safe default) or git
            (faster, but often firewalled).
          default: https
          enum:
            - https
            - git
          showExpr: fields.source !== 'googlesource'
          title: Transport
      showExpr: fields.projects.includes('linux')
      title: Linux
    qemu:
      type: object
      description: How to deploy the QEMU mirror.
      default: {}
      order:
        - source
        - protocol
      properties:
        source:
          type: string
          description: |-
            Upstream host: GitLab (the canonical QEMU project repo) or GitHub
            (its read-only mirror, for when GitLab is unreachable).
          default: gitlab
          format: dynselect-list_qemu_sources
          title: Source
        protocol:
          type: string
          description: |-
            Transport to GitLab: https (the safe default) or git (faster, but
            often firewalled).
          default: https
          enum:
            - https
            - git
          showExpr: fields.source !== 'github'
          title: Transport
      showExpr: fields.projects.includes('qemu')
      title: QEMU
    xfstests_dev:
      type: object
      description: How to deploy the xfstests-dev mirror.
      default: {}
      order:
        - source
        - protocol
      properties:
        source:
          type: string
          description: |-
            Upstream host: kernel.org (the canonical source) or googlesource
            (the Google read-only mirror, for when kernel.org is unreachable).
          default: kernel.org
          enum:
            - kernel.org
            - googlesource
          title: Source
        protocol:
          type: string
          description: |-
            Transport to git.kernel.org: https (the safe default) or git
            (faster, but often firewalled).
          default: https
          enum:
            - https
            - git
          showExpr: fields.source !== 'googlesource'
          title: Transport
      showExpr: fields.projects.includes('xfstests-dev')
      title: xfstests
    xfsprogs_dev:
      type: object
      description: How to deploy the xfsprogs-dev mirror.
      default: {}
      order:
        - source
        - protocol
      properties:
        source:
          type: string
          description: |-
            Upstream host: kernel.org (the canonical source) or googlesource
            (the Google read-only mirror, for when kernel.org is unreachable).
          default: kernel.org
          enum:
            - kernel.org
            - googlesource
          title: Source
        protocol:
          type: string
          description: |-
            Transport to git.kernel.org: https (the safe default) or git
            (faster, but often firewalled).
          default: https
          enum:
            - https
            - git
          showExpr: fields.source !== 'googlesource'
          title: Transport
      showExpr: fields.projects.includes('xfsprogs-dev')
      title: xfsprogs
    fio:
      type: object
      description: How to deploy the fio mirror.
      default: {}
      order:
        - source
        - protocol
      properties:
        source:
          type: string
          description: |-
            Upstream host: GitHub (the canonical fio repo and only public
            source).
          default: github
          enum:
            - github
          title: Source
        protocol:
          type: string
          description: |-
            Transport to GitHub: https (GitHub dropped the git:// transport).
          default: https
          enum:
            - https
          showExpr: fields.source !== 'github'
          title: Transport
      showExpr: fields.projects.includes('fio')
      title: fio
    blktests:
      type: object
      description: How to deploy the blktests mirror.
      default: {}
      order:
        - source
        - protocol
      properties:
        source:
          type: string
          description: |-
            Upstream host: GitHub (the canonical blktests repo and only public
            source).
          default: github
          enum:
            - github
          title: Source
        protocol:
          type: string
          description: |-
            Transport to GitHub: https (GitHub dropped the git:// transport).
          default: https
          enum:
            - https
          showExpr: fields.source !== 'github'
          title: Transport
      showExpr: fields.projects.includes('blktests')
      title: blktests
    bcc:
      type: object
      description: How to deploy the bcc mirror.
      default: {}
      order:
        - source
        - protocol
      properties:
        source:
          type: string
          description: |-
            Upstream host: GitHub (the canonical bcc repo and only public
            source).
          default: github
          enum:
            - github
          title: Source
        protocol:
          type: string
          description: |-
            Transport to GitHub: https (GitHub dropped the git:// transport).
          default: https
          enum:
            - https
          showExpr: fields.source !== 'github'
          title: Transport
      showExpr: fields.projects.includes('bcc')
      title: bcc
    ebpf_syscall:
      type: object
      description: How to deploy the ebpf-syscall mirror.
      default: {}
      order:
        - source
        - protocol
      properties:
        source:
          type: string
          description: |-
            Upstream host: GitHub (the canonical ebpf-syscall repo and only
            public source).
          default: github
          enum:
            - github
          title: Source
        protocol:
          type: string
          description: |-
            Transport to GitHub: https (GitHub dropped the git:// transport).
          default: https
          enum:
            - https
          showExpr: fields.source !== 'github'
          title: Transport
      showExpr: fields.projects.includes('ebpf-syscall')
      title: ebpf-syscall
    systing:
      type: object
      description: How to deploy the systing mirror.
      default: {}
      order:
        - source
        - protocol
      properties:
        source:
          type: string
          description: |-
            Upstream host: GitHub (the canonical systing repo and only public
            source).
          default: github
          enum:
            - github
          title: Source
        protocol:
          type: string
          description: |-
            Transport to GitHub: https (GitHub dropped the git:// transport).
          default: https
          enum:
            - https
          showExpr: fields.source !== 'github'
          title: Transport
      showExpr: fields.projects.includes('systing')
      title: systing
    peers:
      type: array
      description: |-
        Other workbench hosts. Each host becomes a <peer> remote on every Bare
        (ssh://<peer>/<SYSTEM_DIR>/bare/<project>.git, same layout), so a
        developer can `git push <peer> <branch>` a dev branch cross-host for
        that host's worker to build, and its store-index lets a build fetch a
        prebuilt identity from it. List peer hosts, not self; empty =
        single-host.
      default: []
      items:
        type: object
        order:
          - host
          - store_index
        properties:
          host:
            type: string
            description: |-
              SSH host alias of the peer workbench host.
            title: SSH Host
          store_index:
            type: string
            description: |-
              The peer's `SYSTEM_DIR/store-index` directory, read over ssh to
              resolve a prebuilt build identity. The default assumes the peer
              uses the default build-area layout.
            default: ~/.local/state/windmill/workbench/system/store-index
            title: Store Index Dir
        required:
          - host
    refresh:
      type: boolean
      description: |-
        Fetch new refs/tags on already-present Bares (default on). Off =
        create-if-absent only.
      default: true
  required: []
