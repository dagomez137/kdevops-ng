summary: Initialize the workbench
description: |-
  One-time (idempotent) bootstrap, run from the UI after Windmill is up. Thin
  flow over three steps: provision the merged mirrors and their refresh timers,
  cut the durable Bares every worker takes its worktrees from, and provision the
  kdevops-managed VM SSH key. Pick the projects and their deploy options below,
  and re-run it any time to refresh.

  The order is load-bearing. A Bare is cut from the mirror as it stands, so the
  mirrors come first, and a mirror this run creates carries no refs with its
  timer still minutes away, so that one is fetched synchronously before anything
  cuts a Bare. That is what makes a project added to the list usable after one
  run rather than two.

  Returns the `Include` line to add to `~/.ssh/config`, after which a plain `ssh
  <vm>` reaches any guest.
value:
  modules:
    - id: mirror
      summary: Provision the git-mirror refresh timers
      value:
        type: script
        input_transforms:
          bcc:
            type: javascript
            expr: flow_input.bcc
          blktests:
            type: javascript
            expr: flow_input.blktests
          ebpf_syscall:
            type: javascript
            expr: flow_input.ebpf_syscall
          fio:
            type: javascript
            expr: flow_input.fio
          linux:
            type: javascript
            expr: flow_input.linux
          projects:
            type: javascript
            expr: flow_input.projects
          qemu:
            type: javascript
            expr: flow_input.qemu
          systing:
            type: javascript
            expr: flow_input.systing
          xfsprogs_dev:
            type: javascript
            expr: flow_input.xfsprogs_dev
          xfstests_dev:
            type: javascript
            expr: flow_input.xfstests_dev
        path: f/workbench/mirror
        tag_override: vm
      skip_if:
        expr: flow_input.setup_mirrors === false
    - id: fetch
      summary: Clone/refresh the shared sources
      value:
        type: script
        input_transforms:
          bcc:
            type: javascript
            expr: flow_input.bcc
          blktests:
            type: javascript
            expr: flow_input.blktests
          ebpf_syscall:
            type: javascript
            expr: flow_input.ebpf_syscall
          fio:
            type: javascript
            expr: flow_input.fio
          linux:
            type: javascript
            expr: flow_input.linux
          peers:
            type: javascript
            expr: flow_input.peers
          projects:
            type: javascript
            expr: flow_input.projects
          qemu:
            type: javascript
            expr: flow_input.qemu
          refresh:
            type: javascript
            expr: flow_input.refresh
          systing:
            type: javascript
            expr: flow_input.systing
          xfsprogs_dev:
            type: javascript
            expr: flow_input.xfsprogs_dev
          xfstests_dev:
            type: javascript
            expr: flow_input.xfstests_dev
        path: f/workbench/fetch
    - id: ssh_key
      summary: Provision the VM SSH key + host ssh-config
      value:
        type: script
        input_transforms:
          regenerate:
            type: javascript
            expr: flow_input.regenerate_ssh_key
        path: f/workbench/ssh_key
      skip_if:
        expr: flow_input.setup_ssh === false
schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  x-windmill-dyn-select-code: "def list_qemu_sources(filterText: str = \"\", **_: object) -> list:\n    from f.workbench.fetch import qemu_source_options\n    return qemu_source_options(filterText)\n\n\ndef list_mirror_projects(filterText: str = \"\", **_: object) -> list:\n    from f.workbench.fetch import mirror_project_options\n    return mirror_project_options(filterText)\n"
  x-windmill-dyn-select-lang: python3
  order:
    - projects
    - linux
    - qemu
    - xfstests_dev
    - xfsprogs_dev
    - fio
    - blktests
    - bcc
    - ebpf_syscall
    - systing
    - peers
    - refresh
    - setup_ssh
    - regenerate_ssh_key
    - setup_mirrors
  properties:
    linux:
      type: object
      description: How to deploy and refresh the Linux kernel mirror.
      default: {}
      order:
        - trees
        - source
        - protocol
        - on_boot
        - on_inactive
      properties:
        trees:
          type: array
          description: |-
            Trees to integrate into the merged linux.git as remotes (torvalds is
            always the base).
          default:
            - torvalds
            - linux-next
            - linux-stable
            - modules
            - mcgrof
            - da.gomez
            - axboe
            - vfs
            - cel
            - jlayton
            - djwong
            - xfs
          items:
            type: string
            enum:
              - torvalds
              - linux-next
              - linux-stable
              - linux-stable-rc
              - modules
              - mcgrof
              - mcgrof-next
              - da.gomez
              - axboe
              - vfs
              - cel
              - jlayton
              - cxl
              - djwong
              - xfs
          title: Trees
        source:
          type: string
          description: |-
            Upstream host: kernel.org (the canonical source) or googlesource
            (the Google read-only mirror, for when kernel.org is unreachable).
          default: kernel.org
          enum:
            - kernel.org
            - googlesource
          title: Source
        protocol:
          type: string
          description: |-
            Transport to git.kernel.org: https (the safe default) or git
            (faster, but often firewalled).
          default: https
          enum:
            - https
            - git
          showExpr: fields.source !== 'googlesource'
          title: Transport
        on_boot:
          type: string
          description: |-
            First refresh this long after boot (systemd `OnBootSec`, e.g. `10m`,
            `1h`).
          default: 10m
          title: On Boot
        on_inactive:
          type: string
          description: |-
            Next refresh this long after the previous one finishes (systemd
            `OnUnitInactiveSec`).
          default: 10m
          title: On Inactive
      showExpr: fields.projects.includes('linux')
      title: Linux
    peers:
      type: array
      description: |-
        Other workbench hosts to add as <peer> remotes on each Bare, for
        cross-host dev branches (`git push <peer> <branch>`) and
        prebuilt-identity fetch from their store-index. List peer hosts, not
        self; empty = single-host.
      default: []
      items:
        type: object
        order:
          - host
          - store_index
        properties:
          host:
            type: string
            description: |-
              SSH host alias of the peer workbench host.
            title: SSH Host
          store_index:
            type: string
            description: |-
              The peer's `SYSTEM_DIR/store-index` directory, read over ssh to
              resolve a prebuilt build identity. The default assumes the peer
              uses the default build-area layout.
            default: ~/.local/state/windmill/workbench/system/store-index
            title: Store Index Dir
        required:
          - host
    projects:
      type: object
      description: |-
        Which projects to mirror, each its own bare under `MIRRORS_DIR`.
        Selecting one reveals its deploy options below.
      default:
        - linux
        - qemu
        - xfstests-dev
        - xfsprogs-dev
        - fio
        - blktests
        - bcc
        - ebpf-syscall
        - systing
      format: dynmultiselect-list_mirror_projects
      title: Projects
    qemu:
      type: object
      description: How to deploy and refresh the QEMU mirror.
      default: {}
      order:
        - source
        - protocol
        - on_boot
        - on_inactive
      properties:
        source:
          type: string
          description: |-
            Upstream host: GitLab (the canonical QEMU project repo) or GitHub
            (its read-only mirror, for when GitLab is unreachable).
          default: gitlab
          format: dynselect-list_qemu_sources
          title: Source
        protocol:
          type: string
          description: |-
            Transport to GitLab: https (the safe default) or git (faster, but
            often firewalled).
          default: https
          enum:
            - https
            - git
          showExpr: fields.source !== 'github'
          title: Transport
        on_boot:
          type: string
          description: |-
            First refresh this long after boot (systemd `OnBootSec`, e.g. `10m`,
            `1h`).
          default: 10m
          title: On Boot
        on_inactive:
          type: string
          description: |-
            Next refresh this long after the previous one finishes (systemd
            `OnUnitInactiveSec`).
          default: 10m
          title: On Inactive
      showExpr: fields.projects.includes('qemu')
      title: QEMU
    xfstests_dev:
      type: object
      description: How to deploy and refresh the xfstests-dev mirror.
      default: {}
      order:
        - source
        - protocol
        - on_boot
        - on_inactive
      properties:
        source:
          type: string
          description: |-
            Upstream host: kernel.org (the canonical source) or googlesource
            (the Google read-only mirror, for when kernel.org is unreachable).
          default: kernel.org
          enum:
            - kernel.org
            - googlesource
          title: Source
        protocol:
          type: string
          description: |-
            Transport to git.kernel.org: https (the safe default) or git
            (faster, but often firewalled).
          default: https
          enum:
            - https
            - git
          showExpr: fields.source !== 'googlesource'
          title: Transport
        on_boot:
          type: string
          description: |-
            First refresh this long after boot (systemd `OnBootSec`, e.g. `10m`,
            `1h`).
          default: 10m
          title: On Boot
        on_inactive:
          type: string
          description: |-
            Next refresh this long after the previous one finishes (systemd
            `OnUnitInactiveSec`).
          default: 10m
          title: On Inactive
      showExpr: fields.projects.includes('xfstests-dev')
      title: xfstests
    xfsprogs_dev:
      type: object
      description: How to deploy and refresh the xfsprogs-dev mirror.
      default: {}
      order:
        - source
        - protocol
        - on_boot
        - on_inactive
      properties:
        source:
          type: string
          description: |-
            Upstream host: kernel.org (the canonical source) or googlesource
            (the Google read-only mirror, for when kernel.org is unreachable).
          default: kernel.org
          enum:
            - kernel.org
            - googlesource
          title: Source
        protocol:
          type: string
          description: |-
            Transport to git.kernel.org: https (the safe default) or git
            (faster, but often firewalled).
          default: https
          enum:
            - https
            - git
          showExpr: fields.source !== 'googlesource'
          title: Transport
        on_boot:
          type: string
          description: |-
            First refresh this long after boot (systemd `OnBootSec`, e.g. `10m`,
            `1h`).
          default: 10m
          title: On Boot
        on_inactive:
          type: string
          description: |-
            Next refresh this long after the previous one finishes (systemd
            `OnUnitInactiveSec`).
          default: 10m
          title: On Inactive
      showExpr: fields.projects.includes('xfsprogs-dev')
      title: xfsprogs
    fio:
      type: object
      description: How to deploy and refresh the fio mirror.
      default: {}
      order:
        - source
        - protocol
        - on_boot
        - on_inactive
      properties:
        source:
          type: string
          description: |-
            Upstream host: GitHub (the canonical fio repo and only public
            source).
          default: github
          enum:
            - github
          title: Source
        protocol:
          type: string
          description: |-
            Transport to GitHub: https (GitHub dropped the git:// transport).
          default: https
          enum:
            - https
          showExpr: fields.source !== 'github'
          title: Transport
        on_boot:
          type: string
          description: |-
            First refresh this long after boot (systemd `OnBootSec`, e.g. `10m`,
            `1h`).
          default: 10m
          title: On Boot
        on_inactive:
          type: string
          description: |-
            Next refresh this long after the previous one finishes (systemd
            `OnUnitInactiveSec`).
          default: 10m
          title: On Inactive
      showExpr: fields.projects.includes('fio')
      title: fio
    blktests:
      type: object
      description: How to deploy and refresh the blktests mirror.
      default: {}
      order:
        - source
        - protocol
        - on_boot
        - on_inactive
      properties:
        source:
          type: string
          description: |-
            Upstream host: GitHub (the canonical blktests repo and only public
            source).
          default: github
          enum:
            - github
          title: Source
        protocol:
          type: string
          description: |-
            Transport to GitHub: https (GitHub dropped the git:// transport).
          default: https
          enum:
            - https
          showExpr: fields.source !== 'github'
          title: Transport
        on_boot:
          type: string
          description: |-
            First refresh this long after boot (systemd `OnBootSec`, e.g. `10m`,
            `1h`).
          default: 10m
          title: On Boot
        on_inactive:
          type: string
          description: |-
            Next refresh this long after the previous one finishes (systemd
            `OnUnitInactiveSec`).
          default: 10m
          title: On Inactive
      showExpr: fields.projects.includes('blktests')
      title: blktests
    bcc:
      type: object
      description: How to deploy and refresh the bcc mirror.
      default: {}
      order:
        - source
        - protocol
        - on_boot
        - on_inactive
      properties:
        source:
          type: string
          description: |-
            Upstream host: GitHub (the canonical bcc repo and only public
            source).
          default: github
          enum:
            - github
          title: Source
        protocol:
          type: string
          description: |-
            Transport to GitHub: https (GitHub dropped the git:// transport).
          default: https
          enum:
            - https
          showExpr: fields.source !== 'github'
          title: Transport
        on_boot:
          type: string
          description: |-
            First refresh this long after boot (systemd `OnBootSec`, e.g. `10m`,
            `1h`).
          default: 10m
          title: On Boot
        on_inactive:
          type: string
          description: |-
            Next refresh this long after the previous one finishes (systemd
            `OnUnitInactiveSec`).
          default: 10m
          title: On Inactive
      showExpr: fields.projects.includes('bcc')
      title: bcc
    ebpf_syscall:
      type: object
      description: How to deploy and refresh the ebpf-syscall mirror.
      default: {}
      order:
        - source
        - protocol
        - on_boot
        - on_inactive
      properties:
        source:
          type: string
          description: |-
            Upstream host: GitHub (the canonical ebpf-syscall repo and only
            public source).
          default: github
          enum:
            - github
          title: Source
        protocol:
          type: string
          description: |-
            Transport to GitHub: https (GitHub dropped the git:// transport).
          default: https
          enum:
            - https
          showExpr: fields.source !== 'github'
          title: Transport
        on_boot:
          type: string
          description: |-
            First refresh this long after boot (systemd `OnBootSec`, e.g. `10m`,
            `1h`).
          default: 10m
          title: On Boot
        on_inactive:
          type: string
          description: |-
            Next refresh this long after the previous one finishes (systemd
            `OnUnitInactiveSec`).
          default: 10m
          title: On Inactive
      showExpr: fields.projects.includes('ebpf-syscall')
      title: ebpf-syscall
    systing:
      type: object
      description: How to deploy and refresh the systing mirror.
      default: {}
      order:
        - source
        - protocol
        - on_boot
        - on_inactive
      properties:
        source:
          type: string
          description: |-
            Upstream host: GitHub (the canonical systing repo and only public
            source).
          default: github
          enum:
            - github
          title: Source
        protocol:
          type: string
          description: |-
            Transport to GitHub: https (GitHub dropped the git:// transport).
          default: https
          enum:
            - https
          showExpr: fields.source !== 'github'
          title: Transport
        on_boot:
          type: string
          description: |-
            First refresh this long after boot (systemd `OnBootSec`, e.g. `10m`,
            `1h`).
          default: 10m
          title: On Boot
        on_inactive:
          type: string
          description: |-
            Next refresh this long after the previous one finishes (systemd
            `OnUnitInactiveSec`).
          default: 10m
          title: On Inactive
      showExpr: fields.projects.includes('systing')
      title: systing
    refresh:
      type: boolean
      description: Fetch new refs/tags on already-present Bares (default on).
      default: true
    regenerate_ssh_key:
      type: boolean
      description: |-
        Force a fresh VM keypair even if one exists. Invalidates the authorized
        key already baked into every built closure; rebuild closures after.
      default: false
      title: Regenerate SSH Key
    setup_mirrors:
      type: boolean
      description: |-
        Install + enable the `git-mirror@<repo>` refresh timers for the mirrors
        under `$SYSTEM_DIR/mirror` (default on). Off = skip; existing timers
        untouched.
      default: true
      title: Setup Mirrors
    setup_ssh:
      type: boolean
      description: |-
        Provision the kdevops-managed VM SSH key + `~/.ssh`-includable config
        (default on). Off = skip; existing key untouched.
      default: true
      title: Setup SSH
  required: []
