      showExpr: fields.projects.includes('blktests')
      title: blktests
    bcc:
      type: object
      description: How to deploy and refresh the bcc mirror.
      default: {}
      order:
        - source
        - protocol
        - on_boot
        - on_inactive
      properties:
        source:
          type: string
          description: |-
