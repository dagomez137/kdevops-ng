summary: Aggregate suite results into a verdict
description: |-
  Fold the per-suite `f/kunit/collect` results into one rollup, `passed` only
  when every suite passed. Returns a Windmill `render_all` of three native
  tables: run info, one row per suite, and one row per test across all suites,
  failures first. With a `vm_name` it also writes the rollup to
  `<share>/<kver>/report.json`. The host never contacts the guest.
lock: '!inline f/kunit/report.script.lock'
kind: script
schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  order:
    - per_suite
    - vm_name
  properties:
    per_suite:
      type: array
      description: |-
        The `f/kunit/collect` result objects, one per suite, to aggregate.
      default: []
      items:
        type: object
      title: Per Suite
    vm_name:
      type: string
      description: |-
        Optional: when set, also write the rollup to
        `$WORKERS_DIR/shared/kunit/<vm>/<kver>/report.json`.
      default: ''
      title: VM Name
  required:
    - per_suite
tag: vm
