summary: 'Discover a guest''s KUnit readiness over SSH'
description: |-
  Reach a booted guest over vsock-SSH and report whether it is ready to run
  KUnit, which suites it exposes, and which of those are re-runnable rather
  than init-only.

  Returns `{vm, host, booted, kunit_ready, suites, runnable, kernel_version}`.
  Fails fast when the guest is not KUnit-ready (build the kernel with
  CONFIG_KUNIT and CONFIG_KUNIT_DEBUGFS, and boot it with the `kunit` test
  suite) or exposes zero suites, meaning the kernel built no tests (enable them
  built-in or as modules, for instance CONFIG_KUNIT_ALL_TESTS=m; the guest
  declares and loads the booted kernel's test modules at boot by itself).
  Read-only; mutates nothing on the guest.
lock: '!inline f/kunit/discover.script.lock'
kind: script
schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  order:
    - vm_name
  properties:
    vm_name:
      type: object
      description: Booted VM to probe over vsock-SSH for KUnit readiness.
      format: dynselect-list_vms
      title: VM Name
  required:
    - vm_name
tag: vm
