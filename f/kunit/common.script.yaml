summary: KTAP parser and KUnit suite listing
description: |-
  Library module imported by the `f/kunit/*` steps (`from f.kunit.common import
  parse_ktap, list_suites, ...`), not a runnable step. Parses the KTAP a suite
  emits to its `kunit@<suite>.service` journal, lists a booted guest's
  available suites from `/sys/kernel/debug/kunit/`, and writes the run's rollup
  onto the shared `kunit` tree. Contacts the guest only through the
  `f.common.remote` transport in `list_suites`.
lock: '!inline f/kunit/common.script.lock'
kind: script
schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  order: []
  properties: {}
  required: []
