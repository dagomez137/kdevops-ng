summary: Start a KUnit suite on a guest
description: |-
  Capture the guest journal's end-of-now cursor, then start the suite's unit
  over vsock-SSH with `--no-block`: `kunit@<suite>.service` for a re-runnable
  suite, `kunit-results@<suite>.service` for an init-only one, whose boot-time
  results are all there is to read.

  Returns `{vm, suite, unit, cursor}`. The cursor is the run's identity: wait
  and collect read only past it, so they can never confuse this run with a
  previous one, however fast the oneshot finishes.
lock: '!inline f/kunit/start.script.lock'
kind: script
schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  order:
    - vm_name
    - suite
    - runnable
  properties:
    runnable:
      type: boolean
      description: |-
        Whether the suite carries a debugfs `run` node (from `discover`): true
        starts `kunit@<suite>` (re-run), false starts `kunit-results@<suite>`
        (boot-time results read-back only).
      default: true
      title: Runnable
    suite:
      type: string
      description: |-
        KUnit suite name (a `/sys/kernel/debug/kunit/` entry) to start.
    vm_name:
      type: object
      description: Booted VM to start the KUnit suite on, over vsock-SSH.
      format: dynselect-list_vms
      title: VM Name
  required:
    - vm_name
    - suite
tag: vm
