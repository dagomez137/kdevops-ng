summary: Stop a KUnit suite on a guest
description: |-
  Stop the run's suites on the guest over vsock-SSH, covering both templates a
  suite can run as (`kunit@` and the init-only `kunit-results@`). Wired as
  `run.flow`'s `failure_module`, so cancelling a run from the Windmill UI tears
  the guest side down instead of leaving a suite spinning.

  Returns `{vm_name, stopped, skipped_no_transport}`. Idempotent; a guest
  unreachable from the worker is logged and skipped, never raised.
lock: '!inline f/kunit/stop.script.lock'
kind: script
schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  order:
    - vm_name
    - suites
  properties:
    suites:
      type: object
      description: |-
        KUnit suite names whose units to stop. Empty = no-op.
      default: []
      format: dynmultiselect-list_suites
      title: Suites
    vm_name:
      type: object
      description: Booted VM whose KUnit units to stop, over vsock-SSH.
      format: dynselect-list_vms
      title: VM Name
  required:
    - vm_name
tag: vm
