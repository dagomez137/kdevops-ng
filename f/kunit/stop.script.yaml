summary: Stop a KUnit suite on a guest
description: |-
  Stop a suite's units on the guest over vsock-SSH (plus `reset-failed` to clear
  any latched state), covering both templates a suite can run as
  (`kunit@<suite>` and the init-only `kunit-results@<suite>`). Wired as the
  `run.flow` `failure_module` so cancelling a run from the Windmill UI, or any
  step erroring out mid-suite, tears the running unit down on the guest. Stops
  are idempotent; a guest unreachable from the worker is logged and skipped so
  the failure handler never itself fails. Force-stopping a Windmill job bypasses
  `failure_module`; the manual fallback is `systemctl --host <vm> stop
  kunit@<suite>.service`.

  Returns `{vm_name, stopped, skipped_no_transport}`.
lock: '!inline f/kunit/stop.script.lock'
kind: script
schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  order:
    - vm_name
    - suites
  properties:
    suites:
      type: object
      description: |-
        KUnit suite names whose units to stop. Empty = no-op.
      default: []
      format: dynmultiselect-list_suites
      title: Suites
    vm_name:
      type: object
      description: Booted VM whose KUnit units to stop, over vsock-SSH.
      format: dynselect-list_vms
      title: VM Name
  required:
    - vm_name
tag: vm
