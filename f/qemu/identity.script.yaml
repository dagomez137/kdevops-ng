summary: Compute a QEMU build identity
description: |-
  Hash the inputs that fix a QEMU build's bytes into a 12-hex identity and
  return the per-identity install root as `prefix`, version first:
  `destdir/<version>-<label>-<identity>`, or `destdir/<version>-<identity>` with
  no label. QEMU has no kernelrelease to bake an identity into, so the prefix
  carries it: configure and install use it as `--prefix`, and identical inputs
  therefore install under one prefix that can be fetched or reused instead of
  rebuilt.

  Host-independent, so the same inputs give the same identity everywhere. The
  label is cosmetic and the returned `identity` stays the bare hash. Returns
  `identity`, `prefix` and `destdir`.
lock: '!inline f/qemu/identity.script.lock'
kind: script
schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  order:
    - worktree
    - destdir
    - target_list
    - configure_args
    - compiler
    - sanitizer
    - label
  properties:
    compiler:
      type: string
      description: |-
        Toolchain QEMU is built with (gcc/clang); hashed into the digest.
      default: gcc
    configure_args:
      type: string
      description: Extra configure flags; hashed verbatim into the digest.
      default: ''
    destdir:
      type: string
      description: |-
        Slot install root; the per-identity prefix is
        `destdir/<version>-<identity>`.
    label:
      type: string
      description: |-
        Readable build-identity name prefixed to the install prefix and store
        key (from prepare_worktree); cosmetic, not hashed.
      default: ''
    sanitizer:
      type: string
      description: |-
        Sanitizer the build is configured with; hashed into the digest (it
        changes the emitted code, so it must not share a prefix with a stock
        build) and appended to the prefix after the label.
      default: none
      enum:
        - none
        - ubsan
        - asan
        - asan+ubsan
        - tsan
    target_list:
      type: array
      description: |-
        QEMU emulator targets (`--target-list`); comma-joined into the digest.
      default: []
      items:
        type: string
    worktree:
      type: string
      description: |-
        Source worktree to read the build commit from (`git rev-parse HEAD`).
  required:
    - worktree
    - destdir
