summary: Generate QEMU dev tooling
description: |-
  Copy meson's auto-generated `compile_commands.json` from the build dir into
  the source root, where clangd looks for an out-of-tree build's index. meson
  writes it at configure time, so there is no generator to run.

  Reads `worktree`/`build_dir` from `prepare_worktree`.
lock: '!inline f/qemu/devtools.script.lock'
kind: script
schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  order:
    - worktree
    - build_dir
    - compile_commands
  properties:
    build_dir:
      type: string
      description: |-
        Out-of-tree build dir holding meson's `compile_commands.json` (from
        prepare_worktree).
    compile_commands:
      type: boolean
      description: |-
        Symlink `compile_commands.json` into the source root for clangd.
      default: true
    worktree:
      type: string
      description: |-
        QEMU source worktree (from prepare_worktree); the symlink lands here.
  required:
    - worktree
    - build_dir
