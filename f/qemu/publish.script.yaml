summary: Publish an install tree to the Nix store
description: |-
  Add the per-identity install prefix to the Nix store under
  `qemu-<version>-<label>-<identity>`, indexed as a GC root, so a peer can fetch
  it with `nix copy`. The prefix IS one identity's tree, so it is added as-is
  with no staging.

  Run only after a real install; the flow skips it on reuse. Returns the index
  `name`, the resolved `store_path` and the `prefix`.
lock: '!inline f/qemu/publish.script.lock'
kind: script
schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  order:
    - prefix
  properties:
    prefix:
      type: string
      description: |-
        Per-identity install prefix to publish (`destdir/<identity>`).
  required:
    - prefix
