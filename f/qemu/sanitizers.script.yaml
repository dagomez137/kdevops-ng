summary: QEMU sanitizer selections
description: |-
  Library module imported by the QEMU build steps (`from f.qemu import
  sanitizers`), not a runnable step. Holds the one table of sanitizer
  selections a build offers (`none`, `ubsan`, `asan`, `asan+ubsan`, `tsan`) and
  what each adds to `configure`, so the build flow's picker, the configure argv
  and the build identity all read the same source. `configure_args` returns a
  selection's flags and `prefix_segment` the segment that names it in the
  install prefix and the store key. The module docstring states why the
  selections are one table rather than independent switches.
lock: '!inline f/qemu/sanitizers.script.lock'
kind: script
schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  order: []
  properties: {}
  required: []
