summary: Fetch an install tree from a peer
description: |-
  Pull a build identity's whole install tree from a registered peer into the
  local Nix store, before the expensive build, so the following `reuse_check`
  reports `present` and the build is skipped.

  `use_peers` off, or no registered peer carrying the identity, is a no-op and
  the build proceeds locally. Returns `fetched` plus the resolved `prefix`.
lock: '!inline f/qemu/fetch_identity.script.lock'
kind: script
schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  order:
    - prefix
    - use_peers
    - devel
  properties:
    devel:
      type: boolean
      description: |-
        Also fetch this identity's devel layer
        (`qemu-devel-<version>-<label>-<identity>`), which the run-layer sweep
        does not carry. The build flow sets it when a developer worktree is
        requested; off keeps a boot-oriented build from dragging it.
      default: false
      title: Devel layer
    prefix:
      type: string
      description: |-
        Local per-identity install prefix to populate (`destdir/<identity>`).
    use_peers:
      type: boolean
      description: |-
        Sweep the registered peers (`$SYSTEM_DIR/peers`) and fetch this install
        tree from the first that published it. Off builds locally with no fetch.
      default: true
      title: Use Peers
  required:
    - prefix
