summary: Reuse if already built
description: |-
  Probe for an installed QEMU (`bin/qemu-system-*`), first in the per-identity
  prefix and then in the Nix store, and report whether the expensive build can
  be skipped. Run before it. Filesystem only: no devShell, and robust when
  neither the prefix nor a store entry exists.

  Returns `present` and `devel_present` (the run and devel layers are
  independent store paths, so one says nothing about the other) plus the
  resolved `prefix`/`qemu_binary`, which the manifest falls back to when the
  build steps are skipped. Wipe the prefix, or set `reuse` off, to force a
  rebuild.
lock: '!inline f/qemu/reuse_check.script.lock'
kind: script
schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  order:
    - prefix
  properties:
    prefix:
      type: string
      description: Per-identity install prefix to probe (`destdir/<identity>`).
  required:
    - prefix
