summary: Compile QEMU
description: |-
  Build an already-configured QEMU inside the `nixos-flake#build` devShell with
  `make --jobs=$(nproc)`, which drives ninja, so one build uses every CPU and
  concurrent builds share them per build, through the worker units' equal CPU
  weight.

  Reads `build_dir` from `prepare_worktree`, configured by `configure`.
lock: '!inline f/qemu/compile.script.lock'
kind: script
schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  order:
    - build_dir
  properties:
    build_dir:
      type: string
      description: |-
        Out-of-tree build directory (from prepare_worktree, configured by
        configure).
  required:
    - build_dir
