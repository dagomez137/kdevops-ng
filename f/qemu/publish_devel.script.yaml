summary: Publish a devel layer to the Nix store
description: |-
  Add the QEMU build dir's developer subset to the Nix store under
  `qemu-devel-<version>-<label>-<identity>`, keyed on the install prefix's
  basename exactly as the run layer is and indexed as a GC root, so a
  developer's `fetch_devel` resolves this store path to index a worktree. The
  subset is an allowlist, so none of the objects, archives or built emulators
  can leak in and the store path is already lean.

  Run only after a real build; the flow skips it on reuse. Returns the index
  `name`, the resolved `store_path` and the `prefix`.
lock: '!inline f/qemu/publish_devel.script.lock'
kind: script
schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  order:
    - build_dir
    - prefix
  properties:
    build_dir:
      type: string
      description: The QEMU build dir whose developer subset to publish.
    prefix:
      type: string
      description: |-
        Per-identity install prefix (`destdir/<version>-<label>-<identity>`)
        whose basename keys the devel layer.
  required:
    - build_dir
    - prefix
