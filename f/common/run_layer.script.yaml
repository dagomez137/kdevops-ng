summary: Resolve a build's run layer from an install root
description: |-
  Library module imported by the build and resolve steps (`from f.common import
  run_layer`), not a runnable step. `kernel_run_layer` resolves a kernel's boot
  image and the presence of its modules for a release, and `qemu_emulators` the
  installed `qemu-system-*` binaries, from an install root that is either a
  worker destdir or a `/nix/store` path, so both resolve the same way.
lock: '!inline f/common/run_layer.script.lock'
kind: script
schema:
