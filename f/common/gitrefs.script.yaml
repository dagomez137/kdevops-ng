summary: Bare-repository ref listing
description: |-
  Library module imported by the build forms' ref pickers (`from
  f.common.gitrefs import list_refs`), not a runnable step. Lists a host-local
  bare repository's branches and tags by reading `packed-refs` and the loose
  `refs/` entries directly, with no `git` subprocess, so a form dynselect
  answers fast. Branches sort first, then tags newest version first, and the
  linux picker leads with kernel.org's current releases labeled by moniker
  (mainline, stable, longterm, linux-next), a release absent from the local
  mirror marked `not mirrored`.
lock: '!inline f/common/gitrefs.script.lock'
kind: script
schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  order: []
  properties: {}
  required: []
