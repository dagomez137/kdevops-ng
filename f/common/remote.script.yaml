summary: Guest vsock-SSH systemd transport
description: |-
  Library module imported by the suite steps (`from f.common.remote import
  RemoteSystemd, list_vms`), not a runnable step. `RemoteSystemd` drives a
  booted guest's systemd over the AF_VSOCK SSH transport from a `vm` worker, one
  explicit `ssh` argv per call. `list_vms` is the `dynselect-list_vms`
  entrypoint that lists the rendered guests from their sidecars. General by
  design: no per-suite coupling.
lock: '!inline f/common/remote.script.lock'
kind: script
