summary: 'Prepare the worker''s warm main worktree'
description: |-
  Library module imported by the build-prepare steps (`from f.common.worktree
  import prepare, prepare_developer`), not a runnable step. Both lay a worktree
  of a project off the durable Bare at `$SYSTEM_DIR/bare/<project>.git`.

  The two kinds want opposite policies, so they are separate functions: a build
  worktree is forced onto its ref and cleaned, while a developer worktree
  declines rather than clobbers. The module docstring states each one's command
  vocabulary. Used by `f/kernel/prepare_worktree`, `f/qemu/prepare_worktree` and
  `f/workbench/worktree/init`.
lock: '!inline f/common/worktree.script.lock'
kind: script
