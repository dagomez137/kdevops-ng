summary: Shared devShell and command runners
description: |-
  Library module imported by the build and provisioning steps (`from
  f.common.devshell import DevShell, Git, Nix, Systemd`), not a runnable step.
  `DevShell` runs commands inside a nixos-flake devShell, `Git` the flake's own
  git, `Nix` the raw `nix` CLI, and `Systemd` the host `systemd --user` manager.
  All build an argv list, so no shell tokenizes a caller's value, and print the
  exact copy-pasteable invocation before running it.
lock: '!inline f/common/devshell.script.lock'
kind: script
schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  order: []
  properties: {}
  required: []
