summary: 'Discover a guest''s kselftest readiness over SSH'
description: |-
  Reach a booted guest over vsock-SSH and report whether it is ready to run the
  kernel selftests, and which collections its kernel built: the running kernel
  release, the `kselftests-<kver>` tree the kernel build published to the local
  Nix store, and the collections its `kselftest-list.txt` lists.

  Returns `{vm, host, booted, kernel_version, store_path, collections,
  tests_total, version}`, and writes the collection list to the per-VM picker
  cache. Fails fast when the guest is not kselftest-ready, when no tree is
  published for the running kernel (build that kernel with selftests enabled),
  or when the tree lists zero collections. Mutates nothing on the guest.
lock: '!inline f/selftests/discover.script.lock'
kind: script
schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  order:
    - vm_name
  properties:
    vm_name:
      type: object
      description: Booted VM to probe over vsock-SSH for kselftest readiness.
      format: dynselect-list_vms
      title: VM Name
  required:
    - vm_name
tag: vm
