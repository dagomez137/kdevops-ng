summary: KTAP parser and kselftest collection listing
description: |-
  Library module imported by the `f/selftests/*` steps (`from
  f.selftests.common import parse_ktap, item_unit, list_collections, ...`), not
  a runnable step. Parses the flat KTAP `run_kselftest.sh` emits, escapes
  collection names into systemd unit instances, lists a guest kernel's
  collections from the per-VM cache, and writes the run's rollup onto the
  shared `selftests` tree. The module header states the share contract both
  ends keep. Never contacts the guest.
lock: '!inline f/selftests/common.script.lock'
kind: script
schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  order: []
  properties: {}
  required: []
