summary: Write kselftest.env onto the share
description: |-
  Render `<share>/kselftest.env`, the systemd `EnvironmentFile` both guest
  templates read, carrying `KSELFTEST_ARGS`. The one knob is the per-test
  timeout: `override_timeout` > 0 replaces every collection's own upstream
  `settings` timeout (default 45 s per test), 0 keeps them.

  Returns `{vm, env_path, kselftest_args}`. The host never contacts the guest.
lock: '!inline f/selftests/render_config.script.lock'
kind: script
schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  order:
    - vm_name
    - override_timeout
  properties:
    override_timeout:
      type: integer
      description: |-
        Seconds per individual test (`run_kselftest.sh --override-timeout`),
        replacing every collection's own upstream `settings` timeout. 0 keeps
        the upstream timeouts.
      default: 0
      title: Per-test Timeout
    vm_name:
      type: object
      description: |-
        The VM whose `selftests` share receives `kselftest.env` (host-side only;
        the guest is not contacted).
      format: dynselect-list_vms
      title: VM Name
  required:
    - vm_name
tag: vm
