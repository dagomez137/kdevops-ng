summary: Wait for a kselftest run item to finish
description: |-
  Poll the guest's journal for the unit `f/selftests/start` started, reading
  only entries past start's cursor, until systemd's job-outcome record appears:
  PID1 logs exactly one of "Finished <unit>" (`result=done`) or "Failed to start
  <unit>" (`result=failed`) per start job, and "Stopped" when an outside stop
  ended it. The same records carry the run's KTAP and the unit's process exits,
  so the returned `ktap` is the run-scoped document `f/selftests/ collect`
  parses and `exec_status` carries a failing command's exit status when there is
  one (successful exits are journal-logged only at debug level, so a clean run
  leaves it empty; with `--no-error-on-fail` a nonzero exit is an infrastructure
  error, never a test failure).

  Each poll also checks the host `qemu-system@<vm>.service`: any not-alive state
  means the guest is gone and the wait ends with `crashed` set. On expiry of the
  timeout the unit is stopped (`timed_out`).

  Returns `{vm, item, unit, result, exec_status, ktap, crashed, timed_out}`.
lock: '!inline f/selftests/wait.script.lock'
kind: script
schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  order:
    - vm_name
    - item
    - unit
    - cursor
    - timeout
    - poll_interval
    - stream_logs
  properties:
    cursor:
      type: string
      description: |-
        The guest journal cursor `f/selftests/start` captured before starting
        the unit; bounds every read to this run.
      title: Cursor
    item:
      type: string
      description: |-
        Run item being waited on (a collection name or a `COLLECTION:TEST`
        entry).
      title: Item
    poll_interval:
      type: integer
      description: |-
        Seconds between journal polls (and the host liveness check).
      default: 15
      title: Poll Interval
    stream_logs:
      type: boolean
      description: |-
        Each poll, print the guest's new unit + kernel journal (merged) into the
        job log. Off = only a bounded journal tail at the end.
      default: true
      title: Stream Logs
    timeout:
      type: integer
      description: |-
        Maximum seconds to wait for the item to finish before giving up
        (`timed_out`). The runner bounds each individual test itself; this
        deadline bounds a whole collection.
      default: 3600
      title: Timeout
    unit:
      type: string
      description: |-
        The unit `f/selftests/start` started (`kselftest@<instance>.service` or
        `kselftest-test@<instance>.service`).
      title: Unit
    vm_name:
      type: object
      description: Booted VM whose kselftest item to wait on, over vsock-SSH.
      format: dynselect-list_vms
      title: VM Name
  required:
    - vm_name
    - item
    - unit
    - cursor
tag: vm-run
