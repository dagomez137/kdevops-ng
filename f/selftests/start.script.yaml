summary: Start a kselftest run item on a guest
description: |-
  Capture the guest journal's end-of-now cursor, then start the item's unit
  over vsock-SSH with `--no-block`, so the call returns while the collection
  runs. `f/selftests/wait` polls for the outcome.

  Returns `{vm, item, unit, cursor}`. The cursor is the run's identity: wait
  and collect read only past it, so they can never confuse this run with a
  previous one.
lock: '!inline f/selftests/start.script.lock'
kind: script
schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  order:
    - vm_name
    - item
  properties:
    item:
      type: string
      description: |-
        Run item to start: a collection name (a `kselftest-list.txt` collection,
        e.g. `seccomp`, `net/forwarding`) or an explicit `COLLECTION:TEST` entry
        (e.g. `net:fcnal-test.sh`).
      title: Item
    vm_name:
      type: object
      description: Booted VM to start the kselftest item on, over vsock-SSH.
      format: dynselect-list_vms
      title: VM Name
  required:
    - vm_name
    - item
tag: vm
