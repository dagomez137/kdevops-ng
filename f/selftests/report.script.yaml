summary: Aggregate item results into a verdict
description: |-
  Fold the list of `f/selftests/collect` results (one per run item) into one
  rollup, with a `status` of `passed` only when every item passed (a failed,
  crashed, or notrun item fails the run, and so does an empty item list;
  `run_status` is the one rule shared with `f/selftests/judge`). Returns a
  Windmill `render_all` of three native tables (no markdown): run info
  (testsuite, kernel, guest, collections, time(s)), one row per item
  (collection, tests, passed, failed, skipped, time(s), status), and one row
  per test across all items (failures first). When `vm_name` is given it also
  writes the structured rollup to
  `$WORKERS_DIR/shared/selftests/<vm>/<kver>/report.json`. The host never
  contacts the guest.
lock: '!inline f/selftests/report.script.lock'
kind: script
schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  order:
    - per_item
    - vm_name
  properties:
    per_item:
      type: array
      description: |-
        The `f/selftests/collect` result objects, one per run item, to
        aggregate.
      default: []
      items:
        type: object
      title: Per Item
    vm_name:
      type: string
      description: |-
        Optional: when set, also write the rollup to
        `$WORKERS_DIR/shared/selftests/<vm>/<kver>/report.json`.
      default: ''
      title: VM Name
  required:
    - per_item
tag: vm
