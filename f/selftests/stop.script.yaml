summary: Stop a kselftest run on a guest
description: |-
  Stop the run's items on the guest over vsock-SSH, covering both templates an
  item can run as (`kselftest@` and the single-test `kselftest-test@`). Wired
  as `run.flow`'s `failure_module`, so cancelling a run from the Windmill UI
  tears the guest side down instead of leaving a collection spinning.

  Returns `{vm_name, stopped, skipped_no_transport}`. Idempotent; a guest
  unreachable from the worker is logged and skipped, never raised.
lock: '!inline f/selftests/stop.script.lock'
kind: script
schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  order:
    - vm_name
    - items
  properties:
    items:
      type: object
      description: |-
        Run items (collection names or `COLLECTION:TEST` entries) whose units to
        stop. Empty = no-op.
      default: []
      format: dynmultiselect-list_items
      title: Items
    vm_name:
      type: object
      description: Booted VM whose kselftest units to stop, over vsock-SSH.
      format: dynselect-list_vms
      title: VM Name
  required:
    - vm_name
tag: vm
