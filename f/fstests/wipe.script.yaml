summary: Wipe the test and scratch devices
description: |-
  Per-section device prep, before `prepare` creates the mount points: `umount`,
  then `wipefs --all` and `blkdiscard --force`, on each discovered NVMe data
  disk.

  Safe by default, since TEST_DEV and SCRATCH_DEV data is disposable
  (`prepare` re-mkfs's TEST_DEV, `./check` re-mkfs's SCRATCH per test).
  Returns `{vm, wiped, failed}`.
lock: '!inline f/fstests/wipe.script.lock'
kind: script
schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  order:
    - vm_name
    - devices
    - wipe_devices
  properties:
    devices:
      type: array
      description: |-
        The NVMe data disks to wipe (`[{name, size, log_sec}]`, from
        `f/fstests/discover`). Empty wipes nothing.
      default: []
      items:
        type: object
      title: Devices
    vm_name:
      type: object
      description: Booted VM whose test/scratch devices to wipe, over vsock-SSH.
      format: dynselect-list_vms
      title: VM Name
    wipe_devices:
      type: boolean
      description: |-
        `wipefs --all` + `blkdiscard --force` every test/scratch NVMe. Off =
        no-op.
      default: true
      title: Wipe Devices
  required:
    - vm_name
tag: vm
