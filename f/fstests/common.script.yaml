summary: xfstests share config and result helpers
description: |-
  Library module imported by the `f/fstests/*` steps (`from f.fstests.common
  import share_dir, render_local_config, parse_sections, ...`), not a runnable
  step. Holds the host end of the `fstests` virtiofs share: the per-section
  `HOST_OPTIONS` config and `EnvironmentFile` renderers, the `[section]`
  parser, the `./check` flag composer, and the `-R xunit` report parser. The
  module header states the share contract both ends keep. Never contacts the
  guest.
lock: '!inline f/fstests/common.script.lock'
kind: script
schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  order: []
  properties: {}
  required: []
