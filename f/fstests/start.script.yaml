summary: Start a section on a guest
description: |-
  Clear the section's previous `result.xml` from the share, then start
  `xfstests@<section>.service` on the guest over vsock-SSH with `--no-block`,
  so the call returns while `./check` runs. `f/fstests/wait` polls for the
  outcome.

  Returns `{vm, section, unit, active_state}`. A start that never took fails
  here rather than silently in the wait step.
lock: '!inline f/fstests/start.script.lock'
kind: script
schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  order:
    - vm_name
    - section
    - kernel_version
  properties:
    kernel_version:
      type: string
      description: |-
        The guest's kernel release (`uname -r`, from `discover`); selects which
        `<kver>` subtree's stale `result.xml` to remove before the start.
      default: ''
      title: Kernel Version
    section:
      type: string
      description: |-
        xfstests config-section name (the `[section]` header) to start as
        `xfstests@<section>.service`.
    vm_name:
      type: object
      description: Booted VM to start the xfstests section on, over vsock-SSH.
      format: dynselect-list_vms
      title: VM Name
  required:
    - vm_name
    - section
tag: vm
