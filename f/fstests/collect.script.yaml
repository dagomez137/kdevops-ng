summary: 'Collect a section''s results from the share'
description: |-
  Read one xfstests section's `-R xunit` report back from the `fstests` virtiofs
  share. The guest's `./check -s <section>` writes
  `$WORKERS_DIR/shared/fstests/<vm>/<kver>/results/<section>/result.xml`
  (RESULT_BASE follows the unit's `WorkingDirectory=.../%v`, so results are
  keyed by the guest's kernel release); `f/fstests/start` removed any previous
  run's report before starting, so anything present is this run's. Returns a
  scalar overview `{section, fstype, status, crashed, timed_out, report_present,
  tests, passed, failed, notrun, iterations}` (so the check flow's per-section
  forloop renders a tidy one-row-per-section table) plus a `detail` object
  carrying the per-test rows, failing test names with their messages, the
  notruns, the configured filesystem `geometry` (FSTYP, mkfs/mount options,
  block/sector size from the rendered `<section>.config`), and the paths of any
  `.out.bad` diffs and the section `check.log` (consumed by `f/fstests/report`).
  A crashed guest or an aborted (timed-out) section is `failed` even when a
  report exists; a missing or partial report degrades to zeros with
  `report_present` false. Read-only; the host never contacts the guest.
lock: '!inline f/fstests/collect.script.lock'
kind: script
schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  order:
    - vm_name
    - section
    - kernel_version
    - crashed
    - timed_out
  properties:
    crashed:
      type: boolean
      description: |-
        Whether `f/fstests/wait` saw the guest go down (the host
        `qemu-system@<vm>.service` not alive); forces a `failed` verdict.
      default: false
      title: Crashed
    kernel_version:
      type: string
      description: |-
        The guest's kernel release (`uname -r`, from `discover`); selects which
        `<kver>` subtree of the common results share to read.
      title: Kernel Version
    section:
      type: string
      description: |-
        xfstests config-section name (the `[section]` header) whose
        `results/<section>/result.xml` to parse.
    timed_out:
      type: boolean
      description: |-
        Whether `f/fstests/wait` gave up on the section and stopped its unit;
        forces a `failed` verdict.
      default: false
      title: Timed Out
    vm_name:
      type: object
      description: |-
        VM whose `fstests` share (`$WORKERS_DIR/shared/fstests/<vm>/results`) to
        read.
      format: dynselect-list_vms
      title: VM Name
  required:
    - vm_name
    - section
    - kernel_version
tag: vm
