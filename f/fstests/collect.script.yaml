summary: 'Collect a section''s results from the share'
description: |-
  Read one section's `-R xunit` report back from the `fstests` share, under
  `$WORKERS_DIR/shared/fstests/<vm>/<kver>/results/<section>/`.

  Returns a scalar overview `{section, fstype, status, crashed, timed_out,
  started_realtime_ms, ended_realtime_ms, report_present, tests, passed,
  failed, notrun, iterations}` plus a `detail` object carrying the per-test
  rows, the failing tests with their messages, the notruns, the configured
  filesystem `geometry`, and the paths of any `.out.bad` diffs and the section
  `check.log`. The run's outcome from `f/fstests/wait` gates the verdict, and a
  missing report degrades to zeros with `report_present` false rather than
  raising. Read-only; the host never contacts the guest.
lock: '!inline f/fstests/collect.script.lock'
kind: script
schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  order:
    - vm_name
    - section
    - kernel_version
    - crashed
    - timed_out
    - started_realtime_ms
    - ended_realtime_ms
  properties:
    crashed:
      type: boolean
      description: |-
        Whether `f/fstests/wait` saw the guest go down (the host
        `qemu-system@<vm>.service` not alive); forces a `failed` verdict.
      default: false
      title: Crashed
    ended_realtime_ms:
      type: integer
      description: |-
        Wall-clock end of the section's run from `f/fstests/wait`, milliseconds
        since the epoch; null when unknown. Passed through for
        `f/monitoring/annotate`, never a verdict input.
      default: null
      title: Ended Realtime Ms
    kernel_version:
      type: string
      description: |-
        The guest's kernel release (`uname -r`, from `discover`); selects which
        `<kver>` subtree of the common results share to read.
      title: Kernel Version
    section:
      type: string
      description: |-
        xfstests config-section name (the `[section]` header) whose
        `results/<section>/result.xml` to parse.
    started_realtime_ms:
      type: integer
      description: |-
        Wall-clock start of the section's run from `f/fstests/wait`,
        milliseconds since the epoch; null when unknown. Passed through for
        `f/monitoring/annotate`, never a verdict input.
      default: null
      title: Started Realtime Ms
    timed_out:
      type: boolean
      description: |-
        Whether `f/fstests/wait` gave up on the section and stopped its unit;
        forces a `failed` verdict.
      default: false
      title: Timed Out
    vm_name:
      type: object
      description: |-
        VM whose `fstests` share (`$WORKERS_DIR/shared/fstests/<vm>/results`) to
        read.
      format: dynselect-list_vms
      title: VM Name
  required:
    - vm_name
    - section
    - kernel_version
tag: vm
