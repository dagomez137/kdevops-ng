summary: Wait for a section to finish
description: |-
  Poll `xfstests@<section>.service` on the guest over vsock-SSH until it
  settles or the timeout elapses, then dump a bounded tail of the guest's unit
  journal into the job log. Each poll also checks the host
  `qemu-system@<vm>.service`, so a guest that dies ends the wait instead of
  burning the timeout on a dead transport.

  Returns `{vm, section, result, exec_status, active_state, crashed,
  timed_out, started_realtime_ms, ended_realtime_ms}`; the `*_realtime_ms`
  pair is the poll-observed wall-clock window in milliseconds since the epoch.
lock: '!inline f/fstests/wait.script.lock'
kind: script
schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  order:
    - vm_name
    - section
    - timeout
    - poll_interval
  properties:
    poll_interval:
      type: integer
      description: |-
        Seconds between polls of the unit's `ActiveState` (and the host crash
        check).
      default: 15
    section:
      type: string
      description: |-
        xfstests config-section name (the `[section]` header) whose
        `xfstests@<section>.service` to poll.
    timeout:
      type: integer
      description: |-
        Maximum seconds to wait for the section to finish before giving up
        (`timed_out`).
      default: 86400
    vm_name:
      type: object
      description: Booted VM whose xfstests section to wait on, over vsock-SSH.
      format: dynselect-list_vms
      title: VM Name
  required:
    - vm_name
    - section
tag: vm
