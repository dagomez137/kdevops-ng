summary: 'Discover a guest''s readiness over SSH'
description: |-
  Reach a booted guest over vsock-SSH and report whether it is ready to run
  xfstests, and on what: the NVMe data disks and the kernel's supported
  filesystems.

  Returns `{vm, host, booted, fstests_ready, devices, fstyp_supported}`. Fails
  fast when the guest is not xfstests-ready. Two NVMe disks are the minimum
  (TEST + SCRATCH); a btrfs pool wants four, which is surfaced and never
  hard-failed. Read-only; mutates nothing on the guest.
lock: '!inline f/fstests/discover.script.lock'
kind: script
schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  order:
    - vm_name
  properties:
    vm_name:
      type: object
      description: Booted VM to probe over vsock-SSH for xfstests readiness.
      format: dynselect-list_vms
      title: VM Name
  required:
    - vm_name
tag: vm
