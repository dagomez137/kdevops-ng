summary: Aggregate section results into a verdict
description: |-
  Fold the per-section `f/fstests/collect` results into one rollup, `failed`
  if any section reported a failure or a missing report. Returns a Windmill
  `render_all` of three native tables: run info, one row per section (its
  filesystem-under-test geometry and pass/fail counts), and one row per
  distinct test across all sections, failures first. With a `vm_name` it also
  writes the rollup to `<share>/<kver>/report.json`. The host never contacts
  the guest.
lock: '!inline f/fstests/report.script.lock'
kind: script
schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  order:
    - per_section
    - vm_name
  properties:
    per_section:
      type: array
      description: |-
        The `f/fstests/collect` result objects, one per section, to aggregate.
      default: []
      items:
        type: object
      title: Per Section
    vm_name:
      type: string
      description: |-
        Optional: when set, also write the rollup to
        `$WORKERS_DIR/shared/fstests/<vm>/report.json`.
      default: ''
      title: VM Name
  required:
    - per_section
