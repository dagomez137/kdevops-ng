summary: 'Prepare a section''s mounts and fs driver'
description: |-
  Make an xfstests run self-contained on a booted guest over vsock-SSH:
  (re)create the section's mount points and load its `FSTYP` driver. No device
  is formatted or mounted here, because `./check` owns that.

  Returns `{vm, section, fstyp, test_dir, scratch_mnt, use_external, devices}`,
  the section's configured device layout for reference; `f/fstests/wait`
  captures what the run actually built.
lock: '!inline f/fstests/prepare.script.lock'
kind: script
schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  order:
    - vm_name
    - section
  properties:
    section:
      type: string
      description: |-
        xfstests config-section name (the `[section]` header) to prepare.
    vm_name:
      type: object
      description: Booted VM to prepare the xfstests section on, over vsock-SSH.
      format: dynselect-list_vms
      title: VM Name
  required:
    - vm_name
    - section
tag: vm
