summary: Discover a guest's kvcache readiness
description: |-
  Discover a target's kvcache readiness (read-only).

  Checks the target is up and kvcache-ready: the `kvcache-
  bench@.service` template and `vllm-serve.service` are present, the
  replayer is executable at the path the unit's own `ExecStart` names,
  the state directory the units' EnvironmentFile lines point at exists
  and is writable, and a GPU node is visible. Enumerates the running
  kernel release and the replayer's presets, and writes the presets to
  the per-target picker cache the run form's dropdown reads. Mutates
  nothing on the target.

  `target` selects what is probed: `vm` (the default) drives a booted
  guest carrying the kvcache test suite over vsock-SSH, with the state
  directory `/var/lib/kvcache` reached host-side through the `kvcache`
  share; `local` drives the worker host's own `systemd --user` manager
  (a bare-metal GPU box attached as a tagged worker, units installed per
  deploy/spark), with the state directory `$XDG_STATE_HOME/kvcache`
  probed directly.

  Equivalent commands, for the vm target over vsock-SSH:

      systemctl --host <vm> is-system-running
      systemctl --host <vm> list-unit-files \
          kvcache-bench@.service vllm-serve.service
      systemctl --host <vm> show kvcache-bench@probe.service \
          --property=ExecStart
      ssh <vm> test -x <ExecStart path>
      ssh <vm> sh -c 'test -d /var/lib/kvcache \
          && touch /var/lib/kvcache/.probe'
      ssh <vm> ls /dev/nvidia0 /dev/kfd
      ssh <vm> cat /proc/sys/kernel/osrelease
lock: '!inline f/kvcache/discover.script.lock'
kind: script
schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  order:
  - vm_name
  - target
  properties:
    vm_name:
      type: object
      description: |-
        Booted VM (from f/qsu/bringup) to operate on, over vsock-SSH.
      format: dynselect-list_vms
      title: VM Name
    target:
      type: string
      description: |-
        What the step drives: `vm` (the default) reaches a booted guest over
        vsock-SSH with state on the `kvcache` share; `local` drives the worker
        host's own `systemd --user` manager with state under
        `$XDG_STATE_HOME/kvcache` (a bare-metal GPU worker, units installed
        per deploy/spark/README.md).
      default: vm
      enum:
      - vm
      - local
      title: Target
  required:
  - vm_name
tag: vm
