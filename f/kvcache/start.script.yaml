summary: Start one replay preset on a guest
description: |-
  Start one KV cache replay preset on a booted guest over vsock-SSH.

  Removes the preset's previous `summary.json` from the host side of the
  share first (the replayer writes it only at run end; a leftover from
  an earlier run of the same preset on the same kernel would otherwise
  stand in for a run that crashed, and read as a false pass). Then
  starts `kvcache-bench@<preset>.service` with `--no-block`: the unit is
  `Type=oneshot` and a full replay runs for hours, so a blocking start
  would not return. The unit `Requires=vllm-ready.service`, which in
  turn requires `vllm-serve.service`, so systemd brings the engine up
  and gates on its /health response before the replay begins -- there is
  no separate engine-start step and no readiness polling here.
  `f/kvcache/wait` polls for the outcome. After starting, `ActiveState`
  is read back and asserted `activating`/`active`, so a start that never
  took fails here rather than silently in the wait step.

  Equivalent commands:

      # host side of the share (stale-result removal):
      rm --force .../<vm>/<kver>/results/<preset>/summary.json
      # against the guest over vsock-SSH:
      systemctl --host <vm> start --no-block \
          kvcache-bench@<preset>.service
      systemctl --host <vm> show \
          kvcache-bench@<preset>.service --property=ActiveState
lock: '!inline f/kvcache/start.script.lock'
kind: script
schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  order:
  - vm_name
  - preset
  - kernel_version
  properties:
    vm_name:
      type: object
      description: |-
        Booted VM (from f/qsu/bringup) to operate on, over vsock-SSH.
      format: dynselect-list_vms
      title: VM Name
    preset:
      type: string
      title: Preset
      description: |-
        Replay preset (kvcache-bench@<preset>.service instance name). The
        preset dropdown reads the per-VM cache discover writes.
    kernel_version:
      type: string
      default: ''
      title: Kernel Version
      description: |-
        The guest's kernel release (`uname -r`, from discover); keys the
        results subtree.
  required:
  - vm_name
  - preset
tag: vm
